  <title id="ring-t">环形电流右侧小磁针的指向</title>
  <desc id="ring-d">照课本图 20-4：圆环跟纸面垂直，环上朝向读者的一半（右半，实线）电流向下，背向读者的一半画成虚线。由安培定则，环形电流右端是 N 极，所以右侧小磁针静止时 N 极指向右。静态图。</desc>
  <style>.ring-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.ring-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
