<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-b-relay-structure-t opt-b-relay-structure-d">
  <title id="opt-b-relay-structure-t">电磁继电器：控制电路通电</title>
  <desc id="opt-b-relay-structure-d">参照课本图20.3-6的电磁铁、转动衔铁、弹簧与触点结构。蓝色低压控制电路的开关闭合，线圈通电，电磁铁向下吸引衔铁；衔铁绕左侧支点转动，使右端动触点与下方静触点接通，珊瑚红工作电路的另一电源向灯供电。弹簧上端固定、下端连衔铁，断电时向上拉回衔铁；灰色向上箭头表示弹簧回拉方向，蓝色向下箭头表示吸引方向。两电路没有导线连接，仅由衔铁机械控制触点。不标题目中的灯名、气敏电阻、浓度或答案。完整静态图，无动画。</desc>
