  <text class="fl-sy" x="574" y="284" text-anchor="middle" style="fill:#5d6970;font-size:16px">F<tspan font-size="11" dy="3" font-style="normal">浮</tspan><tspan dy="-3" font-style="normal"> = </tspan>G</text>
