  <path d="M28 80L148 80" stroke="#287fc4" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="71" y="143" width="34" height="34" rx="0" fill="#f4f8fa" stroke="#52626a" stroke-width="2"/>
