<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fl-t fl-d">
  <title id="fl-t">浮力与重力比较：上浮、悬浮、下沉、漂浮</title>
  <desc id="fl-d">四个烧杯中物体受到竖直向上的浮力 F浮 和竖直向下的重力 G，线段长短表示力的大小。浸没的物体：F浮 大于 G 上浮，等于 G 悬浮，小于 G 下沉；漂浮在液面静止时 F浮 等于 G。静态图。</desc>
  <style>.fl-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.fl-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
