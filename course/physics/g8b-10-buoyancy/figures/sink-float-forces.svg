  <path d="M88 202L83 191L93 191Z" stroke="#c9554d" stroke-width="0.01" fill="#c9554d" stroke-linejoin="round"/>
  <circle cx="88" cy="160" r="3" fill="#20272b"/>
  <text class="fl-sy" x="96" y="106" text-anchor="start" style="fill:#287fc4;font-size:16px">F<tspan font-size="11" dy="4" font-style="normal">浮</tspan></text>
  <text class="fl-sy" x="96" y="202" text-anchor="start" style="fill:#c9554d;font-size:16px">G</text>
  <text class="fl-lb" x="88" y="260" text-anchor="middle" style="fill:#20272b;font-size:14px;font-weight:600">上浮</text>
  <text class="fl-sy" x="88" y="284" text-anchor="middle" style="fill:#5d6970;font-size:16px">F<tspan font-size="11" dy="3" font-style="normal">浮</tspan><tspan dy="-3" font-style="normal"> > </tspan>G</text>
