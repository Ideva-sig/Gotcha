<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-a-buoyancy-pressure-origin-t opt-a-buoyancy-pressure-origin-d">
  <title id="opt-a-buoyancy-pressure-origin-t">上下表面压力差产生浮力</title>
  <desc id="opt-a-buoyancy-pressure-origin-d">完全浸没的长方体，上下表面面积相同。分别标出从液面到上、下表面的竖直深度；上表面受到向下的压力，下表面受到更大的向上压力。右侧表示压力差即竖直向上的浮力。 静态 SVG，无动画；图形尺寸仅作示意，不表示实测数值或题目数据。</desc>
  <style>.opt-a-buoyancy-pressure-origin-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.opt-a-buoyancy-pressure-origin-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
