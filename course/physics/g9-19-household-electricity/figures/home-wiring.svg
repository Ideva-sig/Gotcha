<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="hw-t hw-d">
  <title id="hw-t">电灯、开关和三孔插座接入家庭电路</title>
  <desc id="hw-d">上方三根线：相线（红）、中性线（蓝）、保护线（绿）。三孔插座：左孔接中性线，右孔接相线，上孔接保护线。开关接在相线和电灯之间，电灯另一端接中性线。插座和电灯是并联的。静态图。</desc>
  <style>.hw-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.hw-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
