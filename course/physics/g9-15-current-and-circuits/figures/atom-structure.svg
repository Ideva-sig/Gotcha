<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-b-atom-structure-t opt-b-atom-structure-d">
  <title id="opt-b-atom-structure-t">原子结构</title>
  <desc id="opt-b-atom-structure-d">通用原子结构示意：中心原子核标“＋”，核外电子点标“－”；原子核带正电，核外电子带负电。圆圈只示意核外运动，不表示真实固定轨道、具体元素、电子数量或空间比例。完整静态图，无动画。</desc>
  <style>.opt-b-atom-structure-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.opt-b-atom-structure-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="620" height="300" fill="#fff" stroke="none"/>
  <text class="opt-b-atom-structure-lb" x="310" y="30" text-anchor="middle" style="fill:#20272b;font-size:14px;font-weight:600">原子结构</text>
  <circle cx="216" cy="155" r="85" fill="#fff" stroke="#52626a" stroke-width="1.6"/>
  <circle cx="216" cy="155" r="27" fill="#fff" stroke="#c9554d" stroke-width="2"/>
  <text class="opt-b-atom-structure-lb" x="216" y="163" text-anchor="middle" style="fill:#c9554d;font-size:22px;font-weight:600">＋</text>
  <circle cx="216" cy="70" r="5" fill="#287fc4"/>
  <text class="opt-b-atom-structure-lb" x="216" y="53" text-anchor="middle" style="fill:#287fc4;font-size:16px;font-weight:600">－</text>
  <circle cx="289.6" cy="197.5" r="5" fill="#287fc4"/>
  <text class="opt-b-atom-structure-lb" x="308.7" y="189.5" text-anchor="middle" style="fill:#287fc4;font-size:16px;font-weight:600">－</text>
  <circle cx="142.4" cy="197.5" r="5" fill="#287fc4"/>
  <text class="opt-b-atom-structure-lb" x="123.3" y="213.5" text-anchor="middle" style="fill:#287fc4;font-size:16px;font-weight:600">－</text>
  <text class="opt-b-atom-structure-lb" x="360" y="140" text-anchor="start" style="fill:#c9554d;font-size:14px;font-weight:600">原子核带正电</text>
  <path d="M251 155L342 155" stroke="#c9554d" stroke-width="1.6" stroke-linecap="round"/>
  <text class="opt-b-atom-structure-lb" x="360" y="224" text-anchor="start" style="fill:#287fc4;font-size:14px;font-weight:600">核外电子带负电</text>
  <path d="M299.6 205.5L326 239L343 239" stroke="#287fc4" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
</svg>
