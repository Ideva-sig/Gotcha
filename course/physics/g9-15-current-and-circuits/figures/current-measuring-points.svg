  <desc id="opt-b-current-points-d">上方两灯串联，A、B、C为依次测量电流的三个位置，各处电流表均串联。下方两灯并联，A、B电流表分别在两条支路，C电流表在分支点之外的干路。图中三个电流表代表测量位置，也可以同时串入；开关为闭合状态。未标电流示数、灯泡规格或练习题中先正常发光的灯泡。完整静态图，无动画。</desc>
