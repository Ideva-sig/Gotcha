  <title id="osc-t">通路、断路、电源短路和灯被短路</title>
  <desc id="osc-d">四个小电路图。通路：开关闭合，灯亮。断路：开关断开，电路中没有电流，灯不亮。电源短路：一根导线（红色）直接接在电源两极，电流很大，会烧坏电源。灯被短路：两灯串联，一根导线（红色）接在一盏灯两端，这盏灯不亮，另一盏灯亮。静态图。</desc>
