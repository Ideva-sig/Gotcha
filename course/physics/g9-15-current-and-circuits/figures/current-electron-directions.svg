<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-b-directions-t opt-b-directions-d">
  <title id="opt-b-directions-t">电流方向与金属导线中自由电子的移动方向</title>
  <desc id="opt-b-directions-d">电池长线在左为正极，短线在右为负极。蓝色箭头表示电池外部的电流：从正极经左侧导线、小灯泡、右侧导线回到负极。珊瑚红箭头仅标在金属导线旁，表示自由电子定向移动，方向与电流相反。不把电子箭头画入电池内部。完整闭合静态图，无动画。</desc>
  <style>.opt-b-directions-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.opt-b-directions-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
