<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fr-t fr-d">
  <title id="fr-t">用弹簧测力计水平匀速拉动木块，测滑动摩擦力</title>
  <desc id="fr-d">木块放在水平长木板上，弹簧测力计水平拉着木块向右匀速运动。拉力 F 向右，长木板对木块的滑动摩擦力 f 向左，二力平衡，大小相等。静态图。</desc>
