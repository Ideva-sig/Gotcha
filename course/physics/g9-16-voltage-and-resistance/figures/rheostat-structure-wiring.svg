<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 410" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-b-rheostat-t opt-b-rheostat-d">
  <title id="opt-b-rheostat-t">滑动变阻器结构与一上一下接法</title>
  <desc id="opt-b-rheostat-d">参考课本图16.4-2：上接线柱C、D连接金属杆，下接线柱A、B连接线圈两端，滑片P同时接触金属杆与电阻丝。示例选择B、D，一上一下接入；蓝色显示B到P的电阻丝及P经金属杆到D的连接，左侧未接入部分为线框灰。下方用课本变阻器符号表示同一接法。未标滑片移动方向、阻值变化或最大阻值位置，避免直接给出练习题结果。完整静态图，无动画。</desc>
