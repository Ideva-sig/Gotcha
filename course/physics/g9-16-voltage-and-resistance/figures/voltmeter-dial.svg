  <title id="opt-b-voltmeter-t">电压表两排刻度与量程</title>
  <desc id="opt-b-voltmeter-d">参考课本图16.1-4及已有电流表画法：上排对应0至15V，下排对应0至3V。按讲义的小量程分度值等分刻度，两排刻度位置一一对应。仅标讲义已有的量程端点，不增加中间刻度数字。下方接线柱为负、3、15。不画指针，不给任何测量读数。完整静态图，无动画。</desc>
