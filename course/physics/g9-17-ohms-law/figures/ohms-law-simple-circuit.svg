<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-b-ohm-t opt-b-ohm-d">
  <title id="opt-b-ohm-t">同一个定值电阻的电流和电压</title>
  <desc id="opt-b-ohm-d">电源、闭合开关、电流表A和定值电阻R组成主回路，电压表V并联在R两端。蓝色I箭头表示通过R的电流，珊瑚红U表示电压表测量R两端电压，R标签对应同一个电阻。电流表、电压表均为正进负出。未标任何数值或计算结果。完整静态图，无动画。</desc>
  <style>.opt-b-ohm-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.opt-b-ohm-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="560" height="300" fill="#fff" stroke="none"/>
  <path d="M80 110L490 110L490 250L80 250L80 110" stroke="#20272b" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M260 110L260 50L360 50L360 110" stroke="#20272b" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <circle cx="155" cy="110" r="13" fill="#fff" stroke="#20272b" stroke-width="2"/>
  <text class="opt-b-ohm-sy" x="155" y="116" text-anchor="middle" style="fill:#20272b;font-size:17px;font-style:normal;font-family:-apple-system,'PingFang SC',sans-serif;font-weight:600">A</text>
  <rect x="293" y="104" width="34" height="12" rx="0" fill="#fff" stroke="#20272b" stroke-width="2"/>
  <circle cx="310" cy="50" r="13" fill="#fff" stroke="#20272b" stroke-width="2"/>
  <text class="opt-b-ohm-sy" x="310" y="56" text-anchor="middle" style="fill:#20272b;font-size:17px;font-style:normal;font-family:-apple-system,'PingFang SC',sans-serif;font-weight:600">V</text>
  <rect x="241" y="234" width="18" height="32" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
  <path d="M245 235L245 265" stroke="#20272b" stroke-width="2" stroke-linecap="round"/>
  <path d="M255 242L255 258" stroke="#20272b" stroke-width="5" stroke-linecap="butt"/>
  <rect x="388" y="246" width="34" height="8" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
  <path d="M388 250L422 250" stroke="#20272b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="388" cy="250" r="2.4" fill="#20272b"/>
  <circle cx="422" cy="250" r="2.4" fill="#20272b"/>
  <circle cx="260" cy="110" r="3.2" fill="#20272b"/>
  <circle cx="360" cy="110" r="3.2" fill="#20272b"/>
  <path d="M200 110L232 110" stroke="#287fc4" stroke-width="2.2" stroke-linecap="butt"/>
  <path d="M240 110L230 114.5L230 105.5Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <text class="opt-b-ohm-sy" x="220" y="145" text-anchor="middle" style="fill:#287fc4;font-size:18px">I</text>
  <text class="opt-b-ohm-sy" x="310" y="145" text-anchor="middle" style="fill:#20272b;font-size:18px">R</text>
  <text class="opt-b-ohm-sy" x="382" y="56" text-anchor="start" style="fill:#c9554d;font-size:18px">U</text>
  <text class="opt-b-ohm-lb" x="130" y="85" text-anchor="middle" style="fill:#20272b;font-size:12px;font-weight:500">＋</text>
  <text class="opt-b-ohm-lb" x="180" y="85" text-anchor="middle" style="fill:#20272b;font-size:12px;font-weight:500">－</text>
  <text class="opt-b-ohm-lb" x="285" y="26" text-anchor="middle" style="fill:#20272b;font-size:12px;font-weight:500">＋</text>
  <text class="opt-b-ohm-lb" x="335" y="26" text-anchor="middle" style="fill:#20272b;font-size:12px;font-weight:500">－</text>
</svg>
