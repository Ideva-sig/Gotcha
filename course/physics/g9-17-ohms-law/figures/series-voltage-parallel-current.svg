<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 385" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-b-division-t opt-b-division-d">
  <title id="opt-b-division-t">串联分压与并联分流</title>
  <desc id="opt-b-division-d">左侧两个定值电阻R1、R2串联，括号分别标出各电阻的电压U1、U2与总电压U；同一电流通过两个电阻，电阻越大分得的电压越大。右侧R1、R2并联，蓝色箭头表示干路电流I分为支路电流I1、I2；各支路电压相等，电阻越小通过的电流越大。电池正极均在左，外部电流方向由正极到负极。所有电阻符号、括号和箭头的长度均不表示数值、大小或比例。完整静态图，无动画。</desc>
  <style>.opt-b-division-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.opt-b-division-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
