  <text class="opt-b-division-lb" x="170" y="25" text-anchor="middle" style="fill:#20272b;font-size:14px;font-weight:600">串联分压</text>
  <text class="opt-b-division-lb" x="505" y="25" text-anchor="middle" style="fill:#20272b;font-size:14px;font-weight:600">并联分流</text>
