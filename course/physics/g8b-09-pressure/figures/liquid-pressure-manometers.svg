<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-a-liquid-pressure-manometers-t opt-a-liquid-pressure-manometers-d">
  <title id="opt-a-liquid-pressure-manometers-t">用液体压强计比较深度和密度</title>
  <desc id="opt-a-liquid-pressure-manometers-d">上排为同一种液体的浅、深两个位置，下排为同一深度的较小、较大密度液体。探头软管连接 U 形管封闭左端，右端开口；压强较大时左液面更低、右液面更高，液面差更大。测压液始终相同。 静态 SVG，无动画；图形尺寸仅作示意，不表示实测数值或题目数据。</desc>
