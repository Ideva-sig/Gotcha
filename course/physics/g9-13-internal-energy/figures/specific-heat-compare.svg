<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="specific-heat-t specific-heat-d">
  <title id="specific-heat-t">比较水和食用油的吸热本领</title>
  <desc id="specific-heat-d">左：质量相等的水和食用油，各用一个相同的电加热器浸在液体中加热，食用油里的温度计升得更高。右：温度随时间变化的图像，食用油的线更陡；在相同时间，食用油升高的温度更多。动画：加热丝发光、热量向上传，图像上的虚线沿时间方向流动。</desc>
  <style>.sh-lb{font:500 13px -apple-system,"PingFang SC",sans-serif;fill:#5d6970;stroke:none}.sh-lb-t{font-weight:600;fill:#20272b}</style>

  <!-- 烧杯：水 -->
  <g>
    <path d="M38 100H134V177Q134 188 123 188H49Q38 188 38 177Z" fill="#dceff9" stroke="none"/>
    <path d="M36 58V178Q36 190 48 190H124Q136 190 136 178V58" stroke="#52626a" stroke-width="2.2"/>
    <circle cx="66" cy="166" r="16" fill="#f2c14e" stroke="none" opacity=".2"><animate attributeName="opacity" values=".12;.38;.12" dur="1.6s" repeatCount="indefinite"/></circle>
    <path d="M66 40V142" stroke="#52626a" stroke-width="1.8"/>
    <path d="M66 142c-8 4-8 9 0 12s8 9 0 12-8 9 0 12" stroke="#bf8d08" stroke-width="2.4"/>
    <path d="M86 172q5-9 0-18q-5-9 0-18" stroke="#c9554d" stroke-width="1.8" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="16" dur="0.9s" repeatCount="indefinite"/></path>
    <rect x="104" y="40" width="12" height="132" rx="6" fill="#fff" stroke="#52626a" stroke-width="1.6"/>
    <path d="M110 172V142" stroke="#c9554d" stroke-width="5"/>
    <circle cx="110" cy="174" r="7" fill="#c9554d" stroke="none"/>
    <text class="sh-lb sh-lb-t" x="86" y="214" text-anchor="middle">水</text>
  </g>

  <!-- 烧杯：食用油 -->
  <g transform="translate(150 0)">
    <path d="M38 100H134V177Q134 188 123 188H49Q38 188 38 177Z" fill="#fae5bd" stroke="none"/>
    <path d="M36 58V178Q36 190 48 190H124Q136 190 136 178V58" stroke="#52626a" stroke-width="2.2"/>
    <circle cx="66" cy="166" r="16" fill="#f2c14e" stroke="none" opacity=".2"><animate attributeName="opacity" values=".12;.38;.12" dur="1.6s" repeatCount="indefinite"/></circle>
    <path d="M66 40V142" stroke="#52626a" stroke-width="1.8"/>
    <path d="M66 142c-8 4-8 9 0 12s8 9 0 12-8 9 0 12" stroke="#bf8d08" stroke-width="2.4"/>
    <path d="M86 172q5-9 0-18q-5-9 0-18" stroke="#c9554d" stroke-width="1.8" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="16" dur="0.9s" repeatCount="indefinite"/></path>
    <rect x="104" y="40" width="12" height="132" rx="6" fill="#fff" stroke="#52626a" stroke-width="1.6"/>
    <path d="M110 172V108" stroke="#c9554d" stroke-width="5"/>
    <circle cx="110" cy="174" r="7" fill="#c9554d" stroke="none"/>
    <text class="sh-lb sh-lb-t" x="86" y="214" text-anchor="middle">食用油</text>
  </g>

  <!-- 温度—时间图像 -->
  <g>
    <path d="M360 190H624M360 190V36" stroke="#20272b" stroke-width="1.6"/>
    <path d="M630 190l-9-4.5v9zM360 30l-4.5 9h9z" fill="#20272b" stroke="none"/>
    <text class="sh-lb" x="372" y="40">温度</text>
    <text class="sh-lb" x="628" y="216" text-anchor="end">时间</text>

    <path d="M360 170L600 60" stroke="#c9554d" stroke-width="2.6" stroke-opacity=".35"/>
    <path d="M360 170L600 60" stroke="#c9554d" stroke-width="2.8" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M360 170L600 125" stroke="#287fc4" stroke-width="2.6" stroke-opacity=".35"/>
    <path d="M360 170L600 125" stroke="#287fc4" stroke-width="2.8" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.4s" repeatCount="indefinite"/></path>
    <text class="sh-lb" x="610" y="64" style="fill:#c9554d">油</text>
    <text class="sh-lb" x="610" y="130" style="fill:#287fc4">水</text>

    <path d="M500 190V106" stroke="#7d8990" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="500" cy="105.8" r="4.5" fill="#c9554d" stroke="none"/>
    <circle cx="500" cy="143.8" r="4.5" fill="#287fc4" stroke="none"/>
    <path d="M514 108V142M510 108h8M510 142h8" stroke="#20272b" stroke-width="1.4"/>
    <text class="sh-lb" x="500" y="216" text-anchor="middle">相同时间</text>
  </g>
</svg>
