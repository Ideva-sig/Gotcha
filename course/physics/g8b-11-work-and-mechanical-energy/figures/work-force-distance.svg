  <circle cx="247" cy="268" r="3" fill="#52626a"/>
  <path d="M282 268L381 268" stroke="#52626a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="247" cy="125" r="3" fill="#52626a"/>
  <path d="M282 125L381 125" stroke="#52626a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M247 100L247 53.6" stroke="#287fc4" stroke-width="2.6" stroke-linecap="butt"/>
  <path d="M247 44L252.4 56L241.6 56Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <text class="opt-a-work-force-distance-sy" x="263" y="76" text-anchor="start" style="fill:#287fc4;font-size:18px">F</text>
  <path d="M397 268L397 133" stroke="#287fc4" stroke-width="2" stroke-linecap="butt"/>
  <path d="M397 125L401.5 135L392.5 135Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <path d="M390 268L404 268" stroke="#287fc4" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M390 125L404 125" stroke="#287fc4" stroke-width="1.6" stroke-linecap="round"/>
