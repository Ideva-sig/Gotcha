<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 345" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-a-work-force-distance-t opt-a-work-force-distance-d">
  <title id="opt-a-work-force-distance-t">沿力方向移动的距离 s</title>
  <desc id="opt-a-work-force-distance-d">同一构件从下方起点竖直提升到上方终点，拉力 F 竖直向上；s 标在与拉力平行的竖直尺寸线上，两端与构件同一参考点的起、终位置等高。 静态 SVG，无动画；图形尺寸仅作示意，不表示实测数值或题目数据。</desc>
  <style>.opt-a-work-force-distance-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.opt-a-work-force-distance-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
