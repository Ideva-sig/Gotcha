<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="mir-t mir-d">
  <title id="mir-t">由 AO 和它的像 A′O′ 画出平面镜</title>
