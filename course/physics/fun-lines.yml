# 角色台词：网站知识点页顶部的一句话（参考 omath.net 的角色气泡），让孩子先笑一下再学。
#
# 规则：
# - 每个知识点 1–2 句，台词里的物理必须正确，和本知识点有关。
# - 动画、电影、小说角色的台词是**改编**（开玩笑），note 写“改编自……”；不改编真实人物的话。
# - 诗句、民谚用**原句**，note 写出处，一字不能错。
# - 不用歌词。头像是 AI 生成的卡通形象，角色版权归原权利人，如有异议请联系下架（见 TAKEDOWN.md），对应关系见文件末尾 avatars。
# - mastered：学到“已掌握”时随机出现的庆祝台词，全科共用。

kps:
  PHY-9-13-1a:
    - who: 柯南
      line: 真相只有一个——质量相同、吸热相同，温度升得慢的那个，比热容大！
      note: 改编自“真相只有一个”
  PHY-9-13-1b:
    - who: 新疆民谚
      line: 早穿皮袄午穿纱，围着火炉吃西瓜。
      note: 原句。沙子比热容小，白天升温快、夜里降温也快，所以一天里冷热差得多。
    - who: 海绵宝宝
      line: 比奇堡住在海底，水的比热容大，这里的温度一天到晚都差不多。我准备好了！
      note: 改编自“我准备好了”
  PHY-9-13-1c:
    - who: 灰太狼
      line: 我一定会回来的！——把 1.5 g 直接代进公式的人，也一定会回来改错的。
      note: 改编自“我一定会回来的”
  PHY-9-13-2a:
    - who: 王安石《梅花》
      line: 遥知不是雪，为有暗香来。
      note: 原句。香味分子扩散到了远处。
    - who: 陆游《村居书喜》
      line: 花气袭人知骤暖。
      note: 原句。天突然变暖，分子热运动更剧烈，花香扩散得更快。
  PHY-9-13-2b:
    - who: 熊大
      line: 俺和熊二抱得紧，靠的是兄弟感情；两块铅柱压紧了能吊起重物，靠的是分子间的引力。
      note: 改编
    - who: 蛋仔
      line: 蛋仔们挤得太近会被弹开，离远一点又互相拉着——分子之间同时有斥力和引力。
      note: 改编（《蛋仔派对》）
  PHY-9-13-3a:
    - who: 艾莎
      line: 我能把整个王国冻成冰——可冰再冷，它的内能也不会是零。
      note: 改编
  PHY-9-13-3b:
    - who: 哪吒
      line: 我命由我不由天！内能也由我：搓手是做功，烤火是热传递，两条路都能让它变。
      note: 改编自“我命由我不由天”
    - who: 派蒙
      line: 旅行者，搓搓手就暖和了，这叫做功；凑到篝火边取暖，这叫热传递！
      note: 改编（《原神》）
  PHY-9-13-3c:
    - who: 孙悟空
      line: 俺老孙火眼金睛：热量只能说“吸收”“放出”，谁说物体“含有热量”，一棒打回去重写！
      note: 改编
  PHY-9-14-1a:
    - who: 李白《望庐山瀑布》
      line: 飞流直下三千尺，疑是银河落九天。
      note: 原句。水从高处落下，重力势能转化为动能。
    - who: 唐僧
      line: 悟空，能量既不会凭空产生，也不会凭空消灭……为师再说一遍，能量既不会……
      note: 改编（唐僧式唠叨）。所以永动机不可能造出来。
  PHY-9-14-2a:
    - who: 闪电麦坤
      line: Ka-chow！吸气、压缩、做功、排气，四个冲程里只有做功冲程在给我使劲。
      note: 改编自《赛车总动员》的口头禅
  PHY-9-14-3a:
    - who: 光头强
      line: 俺砍了一整天木头，才知道 1 kg 干木柴完全燃烧，也就放出约 $1.2\times10^{7}$ J 的热。
      note: 改编
    - who: 光之子
      line: 点燃一根蜡烛就是在烧燃料：蜡里的化学能，变成了内能和光能。
      note: 改编（《光遇》）
  PHY-9-14-3b:
    - who: 樱木花道
      line: 本天才的命中率可比汽油机高——它的效率只有 20%～40%，大部分能量被废气带走了。
      note: 改编自“本天才”
  PHY-9-15-1a:
    - who: 王充《论衡》
      line: 顿牟掇芥，磁石引针。
      note: 原句，出自《论衡·乱龙》。顿牟一般认为是玳瑁，带电后能吸起芥子之类的轻小东西——带电体能吸引轻小物体。
    - who: 皮卡丘
      line: 皮卡皮卡！同种电荷互相排斥，异种电荷互相吸引——皮卡！
      note: 改编
  PHY-9-15-1b:
    - who: 福尔摩斯
      line: 排除一切不可能，剩下的就是真相：摩擦起电没有创造电荷，只是电子从一个物体转移到了另一个物体。
      note: 改编自“排除一切不可能，剩下的就是真相”
  PHY-9-15-2a:
    - who: 哆啦A梦
      line: 任意门打开！在电池外部，电流从正极出门，经过用电器，回到负极。
      note: 改编
  PHY-9-15-2b:
    - who: 蜘蛛侠
      line: 能力越大，责任越大。人体和大地都是导体——碰电之前，先想想这句话。
      note: 改编自“能力越大，责任越大”
  PHY-9-15-2c:
    - who: 海绵宝宝
      line: 我准备好了！电源、用电器、开关、导线，凑齐了才是一个电路。
      note: 改编自“我准备好了”
    - who: 机械师
      line: 破译密码机我拿手：电源、用电器、导线连成通路，灯才会亮；再串一个开关，就能控制它。
      note: 改编（《第五人格》）
  PHY-9-15-2d:
    - who: 终结者
      line: I'll be back. ——被短路的电源可回不来：电流太大，会把电源烧坏。
      note: 改编自“I'll be back”
    - who: 杰克
      line: 我在找近路，电流也会找——一根导线直接连上电源两极，电流全走这条近路，大得能把电源烧坏。
      note: 改编（《第五人格》）
  PHY-9-15-3a:
    - who: 孙悟空
      line: 俺老孙拔一把毫毛变出一群分身，各打各的，倒下一个其余照打——这就是并联。
      note: 改编
  PHY-9-15-3b:
    - who: 诸葛亮
      line: 锦囊在此：要互不影响，就并联；要一起工作、一处断开全部停，就串联。
      note: 改编
    - who: 鲁班七号
      line: 鲁班七号，智商二百五！设计电路先问一句：这几个用电器要不要互不影响？要，就并联。
      note: 改编自“鲁班七号，智商二百五”（《王者荣耀》）
  PHY-9-15-4a:
    - who: 黑猫警长
      line: 电流表上岗规矩：串联进电路，电流从“＋”接线柱进、“－”接线柱出，被测电流不能超过量程。
      note: 改编
  PHY-9-15-5a:
    - who: 三个火枪手
      line: 人人为我，我为人人！并联电路里，干路的电流等于各支路电流加起来。
      note: 改编自“人人为我，我为人人”

mastered:
  - who: 樱木花道
    line: 本天才果然厉害！这个知识点，拿下了。
    note: 改编
  - who: 路飞
    line: 我是要成为海贼王的男人！下一个知识点，出发！
    note: 改编自“我是要成为海贼王的男人”
  - who: 孙悟空
    line: 俺老孙去也！这一关已经过了。
    note: 改编
  - who: 钢铁侠
    line: I am Iron Man. ——这一题也是。
    note: 改编自“I am Iron Man”
  - who: 柯南
    line: 真相只有一个：你已经掌握了！
    note: 改编自“真相只有一个”
  - who: 派蒙
    line: 旅行者，这个知识点已经被我们拿下了！
    note: 改编（《原神》）

# 错题本页的台词：review 有错题时，empty 没有错题时，fixed 重做改对一道时，done 一轮复习做完时
mistakes:
  review:
    - who: 灰太狼
      line: 我一定会回来的！——错题也会，所以趁现在把它们收拾掉。
      note: 改编自“我一定会回来的”
    - who: 孙悟空
      line: 俺老孙在五指山下压了五百年都出来了，这几道错题算什么！
      note: 改编
    - who: 唐僧
      line: 悟空，错题不改，下次还会错……为师再说一遍，错题不改……
      note: 改编（唐僧式唠叨）
    - who: 派蒙
      line: 前面的区域，以后再来探索吧！——不行，错题得现在就改。
      note: 改编自“前面的区域，以后再来探索吧”（《原神》）
    - who: 程小时
      line: 我能跳进照片，回到那一刻；你也能回到做错的那一刻，这次把它改对。
      note: 改编（《时光代理人》）
  empty:
    - who: 樱木花道
      line: 本天才的错题本，干干净净！
      note: 改编自“本天才”
    - who: 柯南
      line: 真相只有一个：现在没有错题。去学下一个知识点吧！
      note: 改编自“真相只有一个”
  fixed:
    - who: 路飞
      line: 又打倒一个！下一个！
      note: 改编
    - who: 哪吒
      line: 我命由我不由天，这道题由我改对了！
      note: 改编自“我命由我不由天”
    - who: 钢铁侠
      line: I am Iron Man. ——错题也拿下了。
      note: 改编自“I am Iron Man”
    - who: 鲁班七号
      line: 鲁班七号，智商二百五！这题拿下！
      note: 改编自“鲁班七号，智商二百五”（《王者荣耀》）
    - who: 光之子
      line: 又点亮了一根蜡烛。
      note: 改编（《光遇》）
  done:
    - who: 诸葛亮
      line: 这一轮复盘完毕，锦囊已经装满，下回考试照锦囊行事。
      note: 改编
    - who: 樱木花道
      line: 本天才果然厉害！
      note: 改编
    - who: 陆光
      line: 这一轮结束。回到过去改变不了结果，回到错题却可以。
      note: 改编（《时光代理人》）
    - who: 园丁
      line: 椅子拆完，密码机也破译完了——这一轮收工！
      note: 改编（《第五人格》）

