  <title id="ssc-t">弹簧测力计的零刻度线、量程、分度值和挂钩</title>
  <desc id="ssc-d">竖直放置的弹簧测力计，刻度板从 0 到 5 N，每 1 N 之间分成 5 个小格，每小格 0.2 N。左侧标出零刻度线、量程，右侧放大标出一个小格即分度值，下端标出挂钩，指针指在零刻度线上。静态图。</desc>
