<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="f3-t f3-d">
  <title id="f3-t">力的示意图怎样表示力的三要素</title>
  <desc id="f3-d">一个木箱放在地面上，在木箱右侧中点用带箭头的线段表示一个向右上方的拉力：线段起点画在作用点上，箭头指向力的方向，线段长短表示力的大小。静态图。</desc>
  <style>.f3-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.f3-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="560" height="230" fill="#fff" stroke="none"/>
  <path d="M40 180L520 180" stroke="#52626a" stroke-width="2" stroke-linecap="round"/>
  <rect x="110" y="100" width="140" height="80" rx="0" fill="#f4f8fa" stroke="#52626a" stroke-width="2.2"/>
  <circle cx="250" cy="140" r="4.2" fill="#287fc4"/>
  <path d="M250 140L400 65" stroke="#287fc4" stroke-width="2.8" stroke-linecap="butt"/>
  <path d="M410 60L400.3 71.9L394.7 60.6Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <text class="f3-lb" x="262" y="166" text-anchor="start" style="fill:#287fc4;font-size:14px;font-weight:600">作用点</text>
  <text class="f3-lb" x="422" y="58" text-anchor="start" style="fill:#287fc4;font-size:14px;font-weight:600">方向</text>
  <path d="M240.2 120.3L400.2 40.3" stroke="#5d6970" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M242.4 124.8L237.9 115.9" stroke="#5d6970" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M402.4 44.8L397.9 35.9" stroke="#5d6970" stroke-width="1.3" stroke-linecap="round"/>
  <text class="f3-lb" x="310.8" y="71.6" text-anchor="end" style="fill:#5d6970;font-size:13px;font-weight:500">大小（长短）</text>
</svg>
