<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="pul-t pul-d">
  <title id="pul-t">滑轮组中承担物重的绳段</title>
  <desc id="pul-d">一个定滑轮和一个动滑轮组成的两种滑轮组。甲：绳子一端系在动滑轮上，动滑轮由 3 段绳子（红色）吊着，n=3，拉力 F 向上。乙：绳子一端系在定滑轮上，动滑轮由 2 段绳子（红色）吊着，n=2，拉力 F 向下。在两个滑轮之间画一条横线，数穿过横线、连着动滑轮的绳段。静态图。</desc>
