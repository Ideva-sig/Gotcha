  <title id="lv-t">撬棒的支点、动力、阻力和力臂</title>
  <desc id="lv-d">撬棒绕支点 O 转动。动力 F1 竖直向下作用在撬棒左端，阻力 F2 是石头对撬棒竖直向下的力。F1 的作用线延长（虚线）后，从 O 向两条作用线作垂线段，得到动力臂 l1 和阻力臂 l2。静态图。</desc>
  <style>.lv-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.lv-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
