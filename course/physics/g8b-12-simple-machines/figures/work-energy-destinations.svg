  <path d="M414.8 73L404.8 77.5L404.8 68.5Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <path d="M279 153L346 233L421 233" stroke="#c9554d" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
  <path d="M414.8 233L404.8 237.5L404.8 228.5Z" stroke="#c9554d" stroke-width="0.01" fill="#c9554d" stroke-linejoin="round"/>
  <circle cx="279" cy="153" r="3" fill="#52626a"/>
  <text class="opt-a-work-energy-destinations-lb" x="486" y="55" text-anchor="middle" style="fill:#287fc4;font-size:14px;font-weight:600">有用功</text>
