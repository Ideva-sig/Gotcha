  <text class="opt-a-work-energy-destinations-sy" x="82" y="172" text-anchor="middle" style="fill:#287fc4;font-size:18px">W<tspan font-size="13" dy="4" font-style="normal">总</tspan></text>
  <path d="M139 153L257.2 153" stroke="#287fc4" stroke-width="2.2" stroke-linecap="butt"/>
