<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="opt-a-work-energy-destinations-t opt-a-work-energy-destinations-d">
  <title id="opt-a-work-energy-destinations-t">有用功和额外功的去向</title>
  <desc id="opt-a-work-energy-destinations-d">总功作为输入，分为达到工作目的的有用功和其他耗费的额外功。两支箭头只表示分类，不代表能量数值或比例；不列举练习题所问的额外功具体成因。 静态 SVG，无动画；图形尺寸仅作示意，不表示实测数值或题目数据。</desc>
  <style>.opt-a-work-energy-destinations-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.opt-a-work-energy-destinations-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="640" height="310" fill="#fff" stroke="none"/>
