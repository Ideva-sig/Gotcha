  <text class="opt-a-work-energy-destinations-lb" x="486" y="216" text-anchor="middle" style="fill:#c9554d;font-size:14px;font-weight:600">额外功</text>
  <text class="opt-a-work-energy-destinations-sy" x="486" y="247" text-anchor="middle" style="fill:#c9554d;font-size:18px">W<tspan font-size="13" dy="4" font-style="normal">额外</tspan></text>
