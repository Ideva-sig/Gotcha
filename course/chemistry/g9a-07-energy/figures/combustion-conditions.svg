<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 435" role="img" aria-labelledby="comb-t comb-d">
  <title id="comb-t">探究燃烧的条件实验示意图</title>
  <desc id="comb-d">展示利用控制变量法探究燃烧条件的经典对比实验，包含铜片上的白磷燃烧与红磷不燃烧、热水中的白磷不燃烧，以及水中通入氧气后白磷燃烧的对照装置与结论。</desc>
  <style>
    .comb-bg { fill: #ffffff; }
    .comb-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
    .comb-panel { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.4; rx: 5px; }
    .comb-head { font: 600 15px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .comb-sec { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .comb-sub { font: 400 11.5px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .comb-bold { font: 600 11.5px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .comb-emp { font: 600 11.5px -apple-system, "PingFang SC", sans-serif; fill: #c9554d; }
    .comb-glass { fill: #f0f7fb; stroke: #52626a; stroke-width: 1.8; fill-opacity: 0.6; }
    .comb-water { fill: #e1f5fe; fill-opacity: 0.7; stroke: #81d4fa; stroke-width: 1.2; }
    .comb-cu { fill: #ffcc80; stroke: #e65100; stroke-width: 2.2; }
    .comb-wp { fill: #fff59d; stroke: #fbc02d; stroke-width: 1.2; }
    .comb-rp { fill: #c62828; stroke: #b71c1c; stroke-width: 1.2; }
    .comb-flame { fill: #ff9800; stroke: #e65100; stroke-width: 1.2; }
    .comb-smoke { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1; stroke-dasharray: 2 2; }
    .comb-tube { fill: none; stroke: #287fc4; stroke-width: 2.2; stroke-linecap: round; }
    .comb-box-g { fill: #f4faf6; stroke: #197a60; stroke-width: 1.2; rx: 4px; }
    .comb-box-y { fill: #fffdf5; stroke: #bf8d08; stroke-width: 1.2; rx: 4px; }
  </style>
  <rect class="comb-bg" width="820" height="435"/>

  <!-- Top Banner -->
  <rect x="20" y="12" width="780" height="34" class="comb-card"/>
  <text class="comb-head" x="410" y="35" text-anchor="middle">探究燃烧条件对比实验（控制变量法）</text>

  <!-- Left: 实验 Ⅰ (x: 20..400, y: 55..275) -->
  <rect class="comb-panel" x="20" y="55" width="380" height="220"/>
  <rect x="30" y="63" width="360" height="22" rx="3" fill="#e8f4fc"/>
  <text class="comb-sec" x="210" y="79" text-anchor="middle" fill="#287fc4">实验 Ⅰ：铜片上白磷与红磷、水中白磷对照</text>

  <!-- Beaker 1: cx=210, width=130, height=105, y=130..235 -->
  <path class="comb-glass" d="M 145 132 L 145 230 Q 145 235 150 235 L 270 235 Q 275 235 275 230 L 275 132 Z"/>
  <path class="comb-water" d="M 147 165 L 273 165 L 273 233 L 147 233 Z"/>
  <line x1="147" y1="165" x2="273" y2="165" stroke="#4fc3f7" stroke-width="1.2"/>
  <text class="comb-sub" x="282" y="185">热水 (80℃)</text>

  <!-- Submerged white phosphorus in hot water -->
  <ellipse cx="210" cy="224" rx="10" ry="6" class="comb-wp"/>
  <text class="comb-emp" x="210" y="255" text-anchor="middle">水中白磷：不燃烧（缺少 O₂）</text>

  <!-- Thin copper plate across beaker mouth: y=130 -->
  <rect class="comb-cu" x="135" y="128" width="150" height="5" rx="1.5"/>
  <text class="comb-bold" x="35" y="146" fill="#e65100">薄铜片（导热）</text>
  <line x1="115" y1="142" x2="135" y2="131" stroke="#e65100" stroke-width="1"/>

  <!-- White phosphorus on left of copper plate (cx=170, y=127) BURNING -->
  <ellipse cx="170" cy="127" rx="8" ry="4" class="comb-wp"/>
  <path class="comb-flame" d="M 170 127 C 163 117 166 107 170 99 C 174 107 177 117 170 127 Z"/>
  <circle cx="171" cy="93" r="3.5" class="comb-smoke"/>
  <circle cx="168" cy="85" r="4.5" class="comb-smoke"/>
  <text class="comb-emp" x="35" y="102">铜片白磷：剧烈燃烧</text>
  <text class="comb-sub" x="35" y="118">产生白烟(达40℃)</text>
  <line x1="125" y1="105" x2="160" y2="114" stroke="#c9554d" stroke-width="1"/>

  <!-- Red phosphorus on right of copper plate (cx=250, y=127) NOT burning -->
  <ellipse cx="250" cy="127" rx="8" ry="4" class="comb-rp"/>
  <text class="comb-bold" x="290" y="110">铜片红磷：不燃烧</text>
  <text class="comb-sub" x="290" y="126">未达着火点(260℃)</text>
  <line x1="288" y1="118" x2="260" y2="125" stroke="#7d8990" stroke-width="1"/>

  <!-- Right: 实验 Ⅱ (x: 420..800, y: 55..275) -->
  <rect class="comb-panel" x="420" y="55" width="380" height="220"/>
  <rect x="430" y="63" width="360" height="22" rx="3" fill="#fdf5f4"/>
  <text class="comb-sec" x="610" y="79" text-anchor="middle" fill="#c9554d">实验 Ⅱ：向热水中白磷通入氧气</text>

  <!-- Beaker 2: cx=610, y=130..235 -->
  <path class="comb-glass" d="M 545 132 L 545 230 Q 545 235 550 235 L 670 235 Q 675 235 675 230 L 675 132 Z"/>
  <path class="comb-water" d="M 547 165 L 673 165 L 673 233 L 547 233 Z"/>
  <line x1="547" y1="165" x2="673" y2="165" stroke="#4fc3f7" stroke-width="1.2"/>
  <text class="comb-sub" x="682" y="185">热水 (80℃)</text>

  <!-- Delivery tube introducing O2 -->
  <path class="comb-tube" d="M 735 110 L 610 110 L 610 216"/>
  <polygon points="685,106 675,110 685,114" fill="#287fc4"/>
  <text class="comb-bold" x="740" y="114" fill="#287fc4">通入 O₂</text>

  <!-- Submerged white phosphorus in hot water now burning! -->
  <ellipse cx="610" cy="224" rx="10" ry="6" class="comb-wp"/>
  <path class="comb-flame" d="M 610 224 C 604 214 606 205 610 198 C 614 205 616 214 610 224 Z"/>
  <text class="comb-emp" x="610" y="255" text-anchor="middle">水中白磷燃烧！（通入 O₂ 接触助燃物）</text>

  <!-- Bottom: Summary Cards Container (x: 20..800, y: 285..420) -->
  <rect class="comb-card" x="20" y="285" width="780" height="135"/>
  <text class="comb-head" x="410" y="304" text-anchor="middle" font-size="13">初中化学核心归纳：控制变量法探究燃烧三条件</text>

  <!-- Group 1 -->
  <rect class="comb-box-g" x="32" y="314" width="236" height="96"/>
  <text class="comb-sec" x="150" y="333" text-anchor="middle" fill="#197a60">对照组 A：探究温度与着火点</text>
  <text class="comb-bold" x="42" y="352">【对比】铜片白磷(燃) vs 铜片红磷(不燃)</text>
  <text class="comb-sub" x="42" y="370">【控制】均接触空气，温度相同(80℃)</text>
  <text class="comb-emp" x="42" y="390">【结论】燃烧必须达到可燃物着火点</text>

  <!-- Group 2 -->
  <rect class="comb-box-y" x="282" y="314" width="246" height="96"/>
  <text class="comb-sec" x="405" y="333" text-anchor="middle" fill="#bf8d08">对照组 B：探究氧气（助燃物）</text>
  <text class="comb-bold" x="292" y="352">【对比】铜片白磷(燃) vs 水中白磷(不燃)</text>
  <text class="comb-sub" x="292" y="370">【控制】温度均达40℃，水中隔绝氧气</text>
  <text class="comb-emp" x="292" y="390">【结论】燃烧必须与氧气（空气）接触</text>

  <!-- Group 3 -->
  <rect class="comb-box-g" x="542" y="314" width="246" height="96"/>
  <text class="comb-sec" x="665" y="333" text-anchor="middle" fill="#197a60">验证组 C：反证与灭火本质</text>
  <text class="comb-bold" x="552" y="352">【反证】热水中通入 O₂，白磷水下燃烧</text>
  <text class="comb-sub" x="552" y="370">【本质】三条件缺一不可，破其一即灭火</text>
  <text class="comb-emp" x="552" y="390">【考点】着火点是固有属性，不得“降低”</text>
</svg>
