<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="lpr-t lpr-d">
  <title id="lpr-t">液体倾倒与量筒平视读数规范示意图</title>
  <desc id="lpr-d">展示液体试剂倾倒操作规范（瓶塞倒放、标签朝手心、口挨口）以及量筒平视凹液面最低处读数与俯视、仰视误差分析。</desc>
  <style>
    .lpr-bg { fill: #ffffff; }
    .lpr-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
    .lpr-glass { fill: #f0f7fb; stroke: #52626a; stroke-width: 1.8; fill-opacity: 0.5; }
    .lpr-liq { fill: #e1f5fe; fill-opacity: 0.8; stroke: #287fc4; stroke-width: 1.2; }
    .lpr-stream { fill: none; stroke: #287fc4; stroke-width: 2.2; stroke-linecap: round; }
    .lpr-lead { fill: none; stroke: #7d8990; stroke-width: 1.2; stroke-dasharray: 2 2; }
    .lpr-dot { fill: #52626a; }
    .lpr-sight { fill: none; stroke-width: 1.4; stroke-dasharray: 3 2; }
    .lpr-title { font: 600 15px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .lpr-label { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .lpr-sub { font: 400 12px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .lpr-err { font: 600 12px -apple-system, "PingFang SC", sans-serif; fill: #c9554d; }
    .lpr-ok { font: 600 12px -apple-system, "PingFang SC", sans-serif; fill: #197a60; }
    .lpr-tag-b { fill: #f0f7fb; stroke: #287fc4; stroke-width: 1.2; rx: 4px; }
    .lpr-tag-g { fill: #f4fbf7; stroke: #197a60; stroke-width: 1.2; rx: 4px; }
    .lpr-table { stroke: #52626a; stroke-width: 2; }
  </style>
  <rect class="lpr-bg" width="780" height="390"/>

  <!-- Top Title Banner -->
  <rect class="lpr-card" x="25" y="14" width="730" height="36"/>
  <text class="lpr-title" x="390" y="37" text-anchor="middle">规范实验操作：液体的倾倒与量筒平视读数</text>

  <!-- Left: 操作 1 液体的倾倒规范 -->
  <rect class="lpr-card" x="25" y="62" width="355" height="314"/>
  <rect x="35" y="72" width="335" height="24" rx="3" fill="#e1f5fe"/>
  <text class="lpr-label" x="202" y="88" text-anchor="middle" fill="#287fc4">操作 1：液体的倾倒规范（图1-14）</text>

  <!-- Table line on left -->
  <line class="lpr-table" x1="50" y1="242" x2="340" y2="242"/>

  <!-- Inverted Stopper on table -->
  <path d="M 262 242 L 282 242 L 278 230 L 266 230 Z" fill="#eceff1" stroke="#52626a" stroke-width="1.4"/>
  <text class="lpr-sub" x="272" y="222" text-anchor="middle">瓶塞倒放</text>

  <!-- Tilted test tube -->
  <g transform="translate(105, 185) rotate(15)">
    <rect class="lpr-glass" x="-12" y="-50" width="24" height="95" rx="11"/>
    <ellipse cx="0" cy="-50" rx="12" ry="3" fill="none" stroke="#52626a" stroke-width="1.4"/>
    <path class="lpr-liq" d="M -11 0 L 11 0 L 11 35 Q 0 45 -11 35 Z"/>
  </g>

  <!-- Reagent bottle -->
  <g transform="translate(175, 140) rotate(-45)">
    <path class="lpr-glass" d="M -10 -40 L 10 -40 L 10 -25 L 25 -10 L 25 50 L -25 50 L -25 -10 L -10 -25 Z"/>
    <rect x="-18" y="5" width="36" height="30" rx="2" fill="#fff9c4" stroke="#c9554d" stroke-width="1.2"/>
    <path class="lpr-liq" d="M -24 15 L 24 15 L 24 49 L -24 49 Z"/>
  </g>

  <!-- Pouring stream -->
  <path class="lpr-stream" d="M 136 126 Q 128 135 120 152"/>

  <!-- Leader lines for Pouring -->
  <line class="lpr-lead" x1="124" y1="130" x2="60" y2="130"/>
  <circle cx="124" cy="130" r="2" class="crp-dot"/>
  <text class="lpr-sub" x="55" y="134" text-anchor="end">口挨口</text>

  <line class="lpr-lead" x1="185" y1="145" x2="235" y2="145"/>
  <circle cx="185" cy="145" r="2" class="crp-dot"/>
  <text class="lpr-sub" x="240" y="149">标签朝手心</text>

  <!-- Left Bottom Summary Card -->
  <rect class="lpr-tag-b" x="35" y="255" width="335" height="105"/>
  <text class="lpr-label" x="45" y="276">倾倒操作要点：口挨口、慢倒入、签向心、塞倒放</text>
  <text class="lpr-sub" x="45" y="298">① 瓶塞倒放：防止瓶塞沾染桌面杂质污染瓶内试剂</text>
  <text class="lpr-sub" x="45" y="320">② 标签朝向手心：防止瓶口残留液体流下腐蚀标签</text>
  <text class="lpr-sub" x="45" y="342">③ 瓶口紧挨试管口：防止液体飞溅或流出管外</text>

  <!-- Right: 操作 2 量筒平视读数 -->
  <rect class="lpr-card" x="400" y="62" width="355" height="314"/>
  <rect x="410" y="72" width="335" height="24" rx="3" fill="#e8f5e9"/>
  <text class="lpr-label" x="577" y="88" text-anchor="middle" fill="#197a60">操作 2：量筒平视读数与误差分析（图1-15）</text>

  <!-- Measuring Cylinder -->
  <line class="lpr-table" x1="425" y1="242" x2="710" y2="242"/>
  <path d="M 450 242 L 490 242 L 482 236 L 458 236 Z" fill="#b0bec5" stroke="#52626a" stroke-width="1.4"/>
  <rect class="lpr-glass" x="460" y="106" width="20" height="130" rx="2"/>

  <!-- Liquid column in cylinder: up to y=172 (60 mL) -->
  <rect class="lpr-liq" x="461" y="172" width="18" height="64"/>
  <path d="M 461 170 Q 470 174 479 170" fill="none" stroke="#287fc4" stroke-width="1.8"/>

  <!-- Tick marks on left side of cylinder -->
  <line x1="460" y1="136" x2="467" y2="136" stroke="#52626a" stroke-width="1.2"/>
  <line x1="460" y1="152" x2="470" y2="152" stroke="#52626a" stroke-width="1.4"/>
  <text x="454" y="156" font-size="10" fill="#52626a" text-anchor="end">70</text>
  <line x1="460" y1="172" x2="470" y2="172" stroke="#287fc4" stroke-width="1.6"/>
  <text x="454" y="176" font-size="10" font-weight="600" fill="#287fc4" text-anchor="end">60</text>
  <line x1="460" y1="192" x2="470" y2="192" stroke="#52626a" stroke-width="1.4"/>
  <text x="454" y="196" font-size="10" fill="#52626a" text-anchor="end">50</text>

  <!-- Three Sight Lines & Labels -->
  <!-- 1. 俯视 -->
  <path class="lpr-sight" stroke="#c9554d" d="M 570 138 L 470 172"/>
  <circle cx="570" cy="138" r="3" fill="#c9554d"/>
  <text class="lpr-err" x="580" y="142">俯视（读数偏大，看高处刻度）</text>

  <!-- 2. 平视 -->
  <path class="lpr-sight" stroke="#197a60" stroke-width="1.8" d="M 570 172 L 470 172"/>
  <circle cx="570" cy="172" r="3" fill="#197a60"/>
  <text class="lpr-ok" x="580" y="176">平视（读数准确，切凹液面最低处）</text>

  <!-- 3. 仰视 -->
  <path class="lpr-sight" stroke="#c9554d" d="M 570 206 L 470 172"/>
  <circle cx="570" cy="206" r="3" fill="#c9554d"/>
  <text class="lpr-err" x="580" y="210">仰视（读数偏小，看低处刻度）</text>

  <!-- Right Bottom Summary Card -->
  <rect class="lpr-tag-g" x="410" y="255" width="335" height="105"/>
  <text class="lpr-label" x="420" y="276">读数核心规范：视线与量筒内凹液面最低处保持水平</text>
  <text class="lpr-sub" x="420" y="298">① 俯视读数：视线偏高，读数偏大，实际量取偏小</text>
  <text class="lpr-sub" x="420" y="320">② 仰视读数：视线偏低，读数偏小，实际量取偏大</text>
  <text class="lpr-sub" x="420" y="342">口诀记忆：“俯大仰小”指读数，实际体积与读数偏差相反</text>
</svg>
