<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" role="img" aria-labelledby="co2prep-t co2prep-d">
  <title id="co2prep-t">实验室制取二氧化碳装置图</title>
  <desc id="co2prep-d">实验室制取与收集二氧化碳规范装置：锥形瓶与长颈漏斗（液封）构成固液常温发生装置，集气瓶向上排空气法（导管伸入瓶底）收集。</desc>
  <style>
    .co2prep-bg { fill: #ffffff; }
    .co2prep-glass { fill: #f0f7fb; stroke: #52626a; stroke-width: 1.8; fill-opacity: 0.5; }
    .co2prep-plug { fill: #8d6e63; stroke: #5d4037; stroke-width: 1.4; }
    .co2prep-tube { fill: none; stroke: #287fc4; stroke-width: 2.2; stroke-linecap: round; }
    .co2prep-acid { fill: #e3f2fd; stroke: #287fc4; stroke-width: 1.2; fill-opacity: 0.7; }
    .co2prep-stone { fill: #b0bec5; stroke: #78909c; stroke-width: 1.2; }
    .co2prep-gas { fill: #fff8e1; stroke: #ffb74d; stroke-width: 1.2; }
    .co2prep-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
    .co2prep-title { font: 600 15px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .co2prep-label { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .co2prep-sub { font: 400 12px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .co2prep-badge { fill: #fdf5f4; stroke: #c9554d; stroke-width: 1.2; rx: 4px; }
    .co2prep-chem { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #c9554d; }
    .co2prep-callout { fill: #ffffff; stroke: #bec9ce; stroke-width: 1.2; rx: 4px; }
  </style>
  <rect class="co2prep-bg" width="740" height="380"/>

  <!-- Left: Generation Apparatus (锥形瓶 + 长颈漏斗 + 双孔塞) -->
  <!-- Conical Flask: center x=130, neck x=110..150 (w=40), body x=60..200 (w=140), y=150..310 -->
  <!-- Conical body -->
  <path class="co2prep-glass" d="M 112 150 L 115 175 L 60 300 Q 60 310 70 310 L 190 310 Q 200 310 200 300 L 145 175 L 148 150 Z"/>

  <!-- Acid solution in flask: from y=240 down to y=308 -->
  <path class="co2prep-acid" d="M 85 240 L 175 240 L 196 308 L 64 308 Z"/>
  <line x1="85" y1="240" x2="175" y2="240" stroke="#287fc4" stroke-width="1.4"/>

  <!-- Marble / Limestone chips at bottom -->
  <polygon class="co2prep-stone" points="75,306 90,292 105,306"/>
  <polygon class="co2prep-stone" points="98,306 112,288 128,306"/>
  <polygon class="co2prep-stone" points="122,306 138,290 152,306"/>
  <polygon class="co2prep-stone" points="146,306 162,292 178,306"/>
  <polygon class="co2prep-stone" points="168,306 182,295 192,306"/>

  <!-- Bubbles rising in acid -->
  <circle cx="95" cy="280" r="1.8" fill="#ffffff" stroke="#287fc4" stroke-width="1"/>
  <circle cx="110" cy="265" r="2" fill="#ffffff" stroke="#287fc4" stroke-width="1"/>
  <circle cx="135" cy="275" r="2.2" fill="#ffffff" stroke="#287fc4" stroke-width="1"/>
  <circle cx="150" cy="255" r="1.8" fill="#ffffff" stroke="#287fc4" stroke-width="1"/>
  <circle cx="165" cy="270" r="2" fill="#ffffff" stroke="#287fc4" stroke-width="1"/>

  <!-- Double-hole Rubber Stopper: x=112..148, y=148..172 -->
  <polygon class="co2prep-plug" points="110,148 150,148 144,172 116,172"/>

  <!-- Thistle Funnel (长颈漏斗): on the left hole x=122 -->
  <!-- Top funnel flare: x=110..134, y=60..85 -->
  <path class="co2prep-glass" d="M 110 60 L 134 60 L 126 82 L 124 82 L 124 275 L 120 275 L 120 82 L 118 82 Z"/>
  <ellipse cx="122" cy="60" rx="12" ry="4" class="co2prep-glass"/>
  <!-- Liquid inside long-neck funnel stem (submerged to form liquid seal!) -->
  <!-- Acid level inside funnel matches flask level at y=240 -->
  <rect class="co2prep-acid" x="120" y="240" width="4" height="35"/>
  <!-- Funnel stem tip submerged at y=275 (below liquid surface y=240 by 35px!) -->

  <!-- Delivery Tube (导气管): passes through right hole x=138 -->
  <!-- Extends just barely below stopper (y=176), goes up to y=120, turns right to x=280, down into jar -->
  <path class="co2prep-tube" d="M 138 178 L 138 120 L 280 120 L 280 295"/>

  <!-- Right: Upright Gas Collecting Jar (向上排空气法集气瓶) -->
  <!-- Position: x=255..305 (w=50), y=180..310 (h=130) -->
  <rect class="co2prep-glass" x="255" y="180" width="50" height="130" rx="3"/>
  <ellipse cx="280" cy="180" rx="25" ry="5" class="co2prep-glass"/>

  <!-- Glass cover slide (毛玻璃片) on top of jar mouth -->
  <line x1="248" y1="178" x2="312" y2="178" stroke="#78909c" stroke-width="2.5"/>

  <!-- CO2 Gas collecting from bottom upwards -->
  <rect class="co2prep-gas" x="256" y="240" width="48" height="68" rx="2"/>
  <line x1="256" y1="240" x2="304" y2="240" stroke="#ffb74d" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#f57c00">CO₂</text>

  <!-- Ground / Table surface line -->
  <line x1="40" y1="315" x2="330" y2="315" stroke="#78909c" stroke-width="2"/>

  <!-- Callout 1: Long-neck funnel liquid seal (Left) -->
  <rect class="co2prep-callout" x="10" y="185" width="105" height="46"/>
  <text class="co2prep-label" x="62" y="204" text-anchor="middle" fill="#c9554d">下端管口液封</text>
  <text class="co2prep-sub" x="62" y="221" text-anchor="middle">防 CO₂ 从漏斗逸出</text>
  <line x1="116" y1="210" x2="122" y2="255" stroke="#7d8990" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Callout 2: Reagents inside flask (Below left) -->
  <text class="co2prep-label" x="130" y="335" text-anchor="middle">大理石 ＋ 稀盐酸</text>
  <text class="co2prep-sub" x="130" y="352" text-anchor="middle">固液常温型（不需加热）</text>

  <!-- Callout 3: Delivery tube deep into bottom (Above jar) -->
  <rect class="co2prep-callout" x="220" y="55" width="120" height="48"/>
  <text class="co2prep-label" x="280" y="74" text-anchor="middle" fill="#287fc4">导管伸入瓶底</text>
  <text class="co2prep-sub" x="280" y="91" text-anchor="middle">由下而上彻底排尽空气</text>
  <line x1="280" y1="103" x2="280" y2="118" stroke="#7d8990" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Callout 4: Upward displacement of air (Below jar) -->
  <text class="co2prep-label" x="280" y="335" text-anchor="middle">向上排空气法</text>
  <text class="co2prep-sub" x="280" y="352" text-anchor="middle">CO₂ 密度大于空气且溶于水</text>

  <!-- Right Side Explanatory Card -->
  <rect class="co2prep-card" x="380" y="25" width="340" height="340"/>
  <text class="co2prep-title" x="550" y="52" text-anchor="middle">实验室制取二氧化碳装置要点</text>

  <!-- Chemical Equation Banner -->
  <rect class="co2prep-badge" x="395" y="70" width="310" height="42"/>
  <text class="co2prep-chem" x="550" y="96" text-anchor="middle">CaCO₃ ＋ 2HCl → CaCl₂ ＋ H₂O ＋ CO₂↑</text>

  <!-- Generation Apparatus Choice -->
  <text class="co2prep-label" x="395" y="136">发生装置选择依据（固液常温型）：</text>
  <text class="co2prep-sub" x="395" y="156">• 反应物为<tspan font-weight="600">固体大理石</tspan>与<tspan font-weight="600">液体稀盐酸</tspan>，常温无需加热</text>
  <text class="co2prep-sub" x="395" y="174">• <tspan font-weight="600" fill="#c9554d">长颈漏斗下端必须伸入液面以下</tspan>（形成液封，</text>
  <text class="co2prep-sub" x="410" y="192">若未液封，产生的 CO₂ 会从长颈漏斗口全部逸出）</text>

  <!-- Collection Apparatus Choice -->
  <text class="co2prep-label" x="395" y="222">收集装置选择依据（向上排空气法）：</text>
  <text class="co2prep-sub" x="395" y="242">• CO₂ 密度比空气大（相对分子质量 44 ＞ 29）</text>
  <text class="co2prep-sub" x="395" y="260">• <tspan font-weight="600" fill="#c9554d">不用排水法收集（CO₂ 能溶于水）</tspan></text>
  <text class="co2prep-sub" x="395" y="278">• <tspan font-weight="600">导气管必须伸入集气瓶底部</tspan>（排尽空气保证纯度）</text>

  <!-- Check Full Method -->
  <text class="co2prep-label" x="395" y="308">验满与放置方法：</text>
  <text class="co2prep-sub" x="395" y="328">• 验满：将<tspan font-weight="600">燃着的木条平放在瓶口</tspan>，木条熄灭即集满</text>
  <text class="co2prep-sub" x="395" y="346">• 放置：集满后用玻璃片盖住瓶口，<tspan font-weight="600">正放</tspan>在实验台上</text>
</svg>
