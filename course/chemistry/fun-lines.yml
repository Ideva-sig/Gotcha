# 化学台词：规则同 course/physics/fun-lines.yml——改编的写“改编”，诗句用原句，化学内容必须正确；头像沿用 public/avatars/。

kps:
  CHEM-9A-01-1a:
  - who: 柯南
    line: 真相只有一个——看有没有生成新物质：没有是物理变化，有就是化学变化！
    note: 改编自“真相只有一个”
  CHEM-9A-01-1b:
  - who: 灰太狼
    line: 平底锅又硬又重，不用烧就看得出来，是物理性质；会不会生锈，要发生化学变化才表现出来，那是化学性质。
    note: 改编
  CHEM-9A-01-2a:
  - who: 哆啦A梦
    line: 四次元口袋里的道具要认全，实验桌上的仪器也一样：试管、烧杯、锥形瓶、酒精灯……名字叫对，才用得对！
    note: 改编
  CHEM-9A-01-2b:
  - who: 钢铁侠
    line: 做实验也要先把护甲穿好：戴护目镜，酒精灯用灯帽盖灭，千万别用嘴吹。
    note: 改编
  CHEM-9A-01-2c:
  - who: 福尔摩斯
    line: 提出问题、猜想、设计实验、观察记录、得出结论——办案和科学探究，走的是同一条路。
    note: 改编
  CHEM-9A-02-1a:
  - who: 皮卡丘
    line: 皮卡皮卡！空气里氮气最多，约占五分之四；氧气约占五分之一，可别记反了！
    note: 改编
  CHEM-9A-02-1b:
  - who: 熊大
    line: 俺最爱的蜂蜜里有糖、有水，还有别的成分，是混合物；纯净物，只有一种物质。
    note: 改编
  CHEM-9A-02-1c:
  - who: 光头强
    line: 空气是宝贵的资源：氧气供呼吸，氮气能当保护气，稀有气体能做电光源——我少砍点树，空气也能好一点。
    note: 改编
  CHEM-9A-02-2a:
  - who: 孙悟空
    line: 俺老孙火眼金睛，看得准：硫在氧气里燃烧，发出明亮的蓝紫色火焰；在空气里，只是淡蓝色。
    note: 改编
  CHEM-9A-02-2b:
  - who: 诸葛亮
    line: 化合反应看“多变一”，氧化反应看“有氧气参加”——两把尺子量两件事，别混为一谈。
    note: 改编
  CHEM-9A-02-3a:
  - who: 樱木花道
    line: 本天才就是催化剂型选手：自己的质量和化学性质不变，却能改变反应的快慢！
    note: 改编自“本天才”
  CHEM-9A-02-3b:
  - who: 派蒙
    line: 旅行者，实验室里制氧气，高锰酸钾要加热，过氧化氢加二氧化锰常温就能分解；工业上则靠沸点不同分离液态空气。
    note: 改编（《原神》）
  CHEM-9A-02-4a:
  - who: 黑猫警长
    line: 铁丝在氧气里燃烧，火星四射；集气瓶底要先放少量水或细沙，不然瓶底炸裂，这个案子我可要立案了。
    note: 改编（《黑猫警长》）
  CHEM-9A-03-1a:
  - who: 王安石《梅花》
    line: 遥知不是雪，为有暗香来。
    note: 原句。远处就能闻到香味，是因为分子在不断运动。
  - who: 陆游《村居书喜》
    line: 花气袭人知骤暖。
    note: 原句。温度升高，分子运动加快，花香扩散得更快。
  CHEM-9A-03-1b:
  - who: 艾莎
    line: 冰化成水，只是水分子之间的间隔和排列变了，分子还是水分子；水通电分解，分子才变成了别的分子。
    note: 改编
  CHEM-9A-03-2a:
  - who: 终结者
    line: 原子里质子数等于核外电子数，所以整个原子不显电性——I’ll be back，带着这笔电荷的账。
    note: 改编自“I’ll be back”
  CHEM-9A-03-2b:
  - who: 鲁班七号
    line: 电子一层一层地住，最外层有 8 个（只有一层时 2 个）就稳定了——这比我的机关还精密。
    note: 改编（《王者荣耀》）
  CHEM-9A-03-2c:
  - who: 蛋仔
    line: 原子一旦失去电子就成了阳离子，得到电子就成了阴离子——蛋仔们抱团和分开，靠的就是电子。
    note: 改编（《蛋仔派对》）
  CHEM-9A-03-3a:
  - who: 柯南
    line: 元素是“同一类原子”的总称：质子数一样，就是同一种元素。
    note: 改编自“真相只有一个”
  CHEM-9A-03-3b:
  - who: 派蒙
    line: 旅行者，周期表的一个格子里有原子序数、元素符号、元素名称和相对原子质量——原子序数就是质子数哦！
    note: 改编（《原神》）
  CHEM-9A-04-1a:
  - who: 海绵宝宝
    line: 比奇堡周围的海水很多，可地球上能直接用的淡水很少——每一滴水都要节约。我准备好了！
    note: 改编自“我准备好了”
  CHEM-9A-04-1b:
  - who: 路飞
    line: 想喝上干净的水，要一步一步来：沉降、过滤、吸附……蒸馏得到的水最纯！
    note: 改编
  CHEM-9A-04-1c:
  - who: 鲁班七号
    line: 过滤要做到“一贴二低三靠”：滤纸要贴紧漏斗，边缘低于漏斗口，液面低于滤纸边缘——差一点，浑水就从旁边溜走了。
    note: 改编（《王者荣耀》）
  CHEM-9A-04-2a:
  - who: 灰太狼
    line: 氢气不纯，一点燃就会爆鸣——点火前先验纯，我被炸飞的次数已经够多了！
    note: 改编
  CHEM-9A-04-2b:
  - who: 蛋仔
    line: 电解水：正极出氧气，负极出氢气，体积比是 1∶2——记不住就念“正氧负氢，氢二氧一”。
    note: 改编（《蛋仔派对》）
  CHEM-9A-04-2c:
  - who: 程小时
    line: 判断氧化物，三个条件一个都不能少：是化合物、只有两种元素、其中一种是氧。
    note: 改编（《时光代理人》）
  CHEM-9A-04-3a:
  - who: 哆啦A梦
    line: 化学式里，前面的数字是粒子的个数，右下角的数字是一个分子里的原子个数——两个“2”，意思可不一样！
    note: 改编
  CHEM-9A-04-3d:
  - who: 钢铁侠
    line: 化合价就是元素的“配对暗号”：先背熟表 4-3，后面求价、写式全靠它。
    note: 改编
  CHEM-9A-04-3b:
  - who: 诸葛亮
    line: 化合物里，正价和负价加起来要等于零——账算平了，化学式才算对。
    note: 改编
  CHEM-9A-04-3e:
  - who: 孙悟空
    line: 先找最小公倍数，再除出原子数，最后验一遍代数和——五步一过，化学式俺老孙一眼定乾坤。
    note: 改编
  CHEM-9A-04-3c:
  - who: 钢铁侠
    line: 算相对分子质量：每种原子的相对原子质量乘个数，再加起来；括号外的小数字，要乘到括号里每个原子上。
    note: 改编
  CHEM-9A-04-4a:
  - who: 柯南
    line: 氢气燃烧生成水，水通电又分解出氢气和氧气——两个实验指向同一个真相：水由氢元素和氧元素组成。
    note: 改编自“真相只有一个”
  CHEM-9A-05-1a:
  - who: 孙悟空
    line: 俺老孙七十二变，变来变去还是那些原子——化学反应前后，原子的种类、数目、质量都不变。
    note: 改编
  - who: 唐僧
    line: 悟空，参加反应的各物质质量总和，等于生成的各物质质量总和……为师再说一遍，参加反应的……
    note: 改编（唐僧式唠叨）
  CHEM-9A-05-1b:
  - who: 黑猫警长
    line: 有气体参加或生成的反应，要在密闭容器里做，不然气体跑了，天平就会“不平”，证据就不全了。
    note: 改编（《黑猫警长》）
  CHEM-9A-05-2a:
  - who: 蜘蛛侠
    line: 能力越大，责任越大——方程式写得越多，越要记得配平：左右两边每种原子的个数都要相等。
    note: 改编自“能力越大，责任越大”
  - who: 福尔摩斯
    line: 写方程式，先得有“客观事实”：反应不存在，再漂亮的配平也是假案。
    note: 改编
  CHEM-9A-05-2b:
  - who: 诸葛亮
    line: 化学方程式里，各物质的质量比是固定的：先写对方程式、配平，再按质量比列比例式——这是计算的根基。
    note: 改编
  CHEM-9A-06-1a:
  - who: 皮卡丘
    line: 金刚石最硬，石墨很软——同样都是碳，碳原子排列方式不同，脾气也不同，皮卡！
    note: 改编
  CHEM-9A-06-1b:
  - who: 哪吒
    line: 碳常温下很稳定；高温下能燃烧，还能夺走氧化铜里的氧——这叫还原性。
    note: 改编
  CHEM-9A-06-2a:
  - who: 光之子
    line: 蜡烛一根根熄灭，低处的先灭——二氧化碳不燃烧、不支持燃烧，密度还比空气大。
    note: 改编（《光遇》）
  CHEM-9A-06-2b:
  - who: 终结者
    line: 一氧化碳无色无味却有毒，它会抢走血红蛋白，让人缺氧——冬天烧炭取暖，一定要通风。
    note: 改编（终结者形象）
  CHEM-9A-06-3a:
  - who: 派蒙
    line: 旅行者，实验室制二氧化碳，用大理石（或石灰石）和稀盐酸，向上排空气法收集，验满时把燃着的木条放在瓶口。
    note: 改编（《原神》）
  CHEM-9A-06-3b:
  - who: 福尔摩斯
    line: 先看反应物的状态和条件，选发生装置；再看气体的密度和溶解性，选收集装置——推理要有次序。
    note: 改编
  CHEM-9A-06-4a:
  - who: 蛋仔
    line: 二氧化碳通进紫色石蕊溶液，变红的不是二氧化碳，而是它和水反应生成的碳酸；一加热，碳酸分解，又变回紫色。
    note: 改编（《蛋仔派对》）
  CHEM-9A-07-1a:
  - who: 熊大
    line: 森林着火，开出一条隔离带，就是把可燃物移走——燃烧的三个条件缺一不可，破坏任何一个就能灭火。
    note: 改编
  CHEM-9A-07-1b:
  - who: 黑猫警长
    line: 煤气泄漏，不要开灯、不要打火，先关阀门，再开窗通风！
    note: 改编（《黑猫警长》）
  CHEM-9A-07-1c:
  - who: 艾莎
    line: 燃烧要放热，冰雪女王最怕；不过也有吸热的反应，会让周围变凉。
    note: 改编
  CHEM-9A-07-2a:
  - who: 钢铁侠
    line: 煤、石油、天然气是化石燃料，用完不能再生；天然气的主要成分是甲烷。
    note: 改编
  CHEM-9A-07-2b:
  - who: 光头强
    line: 煤燃烧会放出二氧化硫、二氧化氮，溶进雨水形成酸雨；二氧化碳排多了，会加剧温室效应。
    note: 改编
  CHEM-9A-07-2c:
  - who: 哆啦A梦
    line: 氢气燃烧只生成水，热值又高，可惜制取成本高、储存运输也不容易，所以它还在路上。
    note: 改编
  CHEM-9A-07-3a:
  - who: 柯南
    line: 铜片上的白磷燃烧、红磷不燃，说明要达到着火点；水里的白磷不燃，说明要有氧气——真相只有一个！
    note: 改编自“真相只有一个”
mastered:
- who: 樱木花道
  line: 本天才果然厉害！这个知识点，拿下了。
  note: 改编
- who: 路飞
  line: 我是要成为海贼王的男人！下一个知识点，出发！
  note: 改编自“我是要成为海贼王的男人”
- who: 孙悟空
  line: 俺老孙去也！这一关已经过了。
  note: 改编
- who: 钢铁侠
  line: I am Iron Man. ——这一题也是。
  note: 改编自“I am Iron Man”
- who: 柯南
  line: 真相只有一个：你已经掌握了！
  note: 改编自“真相只有一个”
- who: 派蒙
  line: 旅行者，这个知识点已经被我们拿下了！
  note: 改编（《原神》）
mistakes:
  review:
  - who: 灰太狼
    line: 我一定会回来的！——错题也会，所以趁现在把它们收拾掉。
    note: 改编自“我一定会回来的”
  - who: 孙悟空
    line: 俺老孙在五指山下压了五百年都出来了，这几道错题算什么！
    note: 改编
  - who: 唐僧
    line: 悟空，错题不改，下次还会错……为师再说一遍，错题不改……
    note: 改编（唐僧式唠叨）
  - who: 派蒙
    line: 前面的区域，以后再来探索吧！——不行，错题得现在就改。
    note: 改编自“前面的区域，以后再来探索吧”（《原神》）
  - who: 程小时
    line: 我能跳进照片，回到那一刻；你也能回到做错的那一刻，这次把它改对。
    note: 改编（《时光代理人》）
  empty:
  - who: 樱木花道
    line: 本天才的错题本，干干净净！
    note: 改编自“本天才”
  - who: 柯南
    line: 真相只有一个：现在没有错题。去学下一个知识点吧！
    note: 改编自“真相只有一个”
  fixed:
  - who: 路飞
    line: 又打倒一个！下一个！
    note: 改编
  - who: 哪吒
    line: 我命由我不由天，这道题由我改对了！
    note: 改编自“我命由我不由天”
  - who: 钢铁侠
    line: I am Iron Man. ——错题也拿下了。
    note: 改编自“I am Iron Man”
  - who: 鲁班七号
    line: 鲁班七号，智商二百五！这题拿下！
    note: 改编自“鲁班七号，智商二百五”（《王者荣耀》）
  - who: 光之子
    line: 又点亮了一根蜡烛。
    note: 改编（《光遇》）
  done:
  - who: 诸葛亮
    line: 这一轮复盘完毕，锦囊已经装满，下回考试照锦囊行事。
    note: 改编
  - who: 樱木花道
    line: 本天才果然厉害！
    note: 改编
  - who: 陆光
    line: 这一轮结束。回到过去改变不了结果，回到错题却可以。
    note: 改编（《时光代理人》）
  - who: 园丁
    line: 椅子拆完，密码机也破译完了——这一轮收工！
    note: 改编（《第五人格》）
