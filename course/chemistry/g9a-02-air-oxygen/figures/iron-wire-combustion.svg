<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="iwc-t iwc-d">
  <title id="iwc-t">铁丝在氧气中燃烧实验示意图</title>
  <desc id="iwc-d">展示细铁丝盘成螺旋状系火柴引燃、在氧气中剧烈燃烧火星四射，以及瓶底留少量水防炸裂的规范操作与分析。</desc>
  <style>
    .iwc-bg { fill: #ffffff; }
    .iwc-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
    .iwc-glass { fill: #f0f7fb; stroke: #52626a; stroke-width: 1.8; fill-opacity: 0.5; }
    .iwc-water { fill: #e1f5fe; stroke: #287fc4; stroke-width: 1.2; fill-opacity: 0.8; }
    .iwc-wire { fill: none; stroke: #455a64; stroke-width: 2.2; stroke-linecap: round; }
    .iwc-wire-red { fill: none; stroke: #d32f2f; stroke-width: 2.2; stroke-linecap: round; }
    .iwc-match { stroke: #8d6e63; stroke-width: 2; stroke-linecap: round; }
    .iwc-spark { stroke: #bf8d08; stroke-width: 1.4; stroke-linecap: round; }
    .iwc-flame { fill: #ffb74d; stroke: #f57c00; stroke-width: 1.2; }
    .iwc-bead { fill: #212121; stroke: #000000; stroke-width: 0.8; }
    .iwc-lead { fill: none; stroke: #7d8990; stroke-width: 1.2; stroke-dasharray: 2 2; }
    .iwc-dot { fill: #52626a; }
    .iwc-title { font: 600 15px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .iwc-label { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .iwc-sub { font: 400 12px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .iwc-eq { font: 600 12px -apple-system, "PingFang SC", sans-serif; fill: #287fc4; }
    .iwc-sec { fill: #fdf5f4; stroke: #c9554d; stroke-width: 1.2; rx: 4px; }
    .iwc-sec-b { fill: #f0f7fb; stroke: #287fc4; stroke-width: 1.2; rx: 4px; }
  </style>
  <rect class="iwc-bg" width="780" height="390"/>

  <!-- Top Title Banner -->
  <rect class="iwc-card" x="25" y="14" width="730" height="36"/>
  <text class="iwc-title" x="390" y="37" text-anchor="middle">实验活动：细铁丝在氧气中燃烧性质探究</text>

  <!-- Left: 装置示意图与对比 -->
  <rect class="iwc-card" x="25" y="62" width="385" height="314"/>
  <rect x="35" y="72" width="365" height="24" rx="3" fill="#e1f5fe"/>
  <text class="iwc-label" x="217" y="88" text-anchor="middle" fill="#287fc4">实验装置与燃烧现象（课本图 2-13）</text>

  <!-- Comparison 1 (Left): In air -->
  <rect x="35" y="106" width="100" height="145" rx="4" fill="#ffffff" stroke="#bec9ce" stroke-width="1"/>
  <text class="iwc-label" x="85" y="124" font-size="12" text-anchor="middle" fill="#c9554d">在空气中加热</text>
  <!-- Tongs holding iron spiral -->
  <line x1="50" y1="140" x2="80" y2="160" stroke="#78909c" stroke-width="2"/>
  <!-- Red hot spiral wire -->
  <path class="iwc-wire-red" d="M 80 160 Q 88 163 80 168 Q 72 173 80 178 Q 88 183 80 188"/>
  <!-- Alcohol flame under wire -->
  <path class="iwc-flame" d="M 80 215 C 72 205 74 195 80 190 C 86 195 88 205 80 215 Z"/>
  <text class="iwc-sub" x="85" y="235" text-anchor="middle" fill="#c9554d">红热，不燃烧</text>

  <!-- Main Apparatus (Right): In Oxygen Gas Jar: cx=240, y=110..245, w=84 -->
  <!-- Glass cover plate -->
  <rect x="190" y="115" width="100" height="6" rx="2" fill="#cfd8dc" stroke="#52626a" stroke-width="1.4"/>
  <!-- Gas Jar body -->
  <path class="iwc-glass" d="M 205 121 L 205 130 Q 192 140 192 155 L 192 238 Q 192 244 198 244 L 282 244 Q 288 244 288 238 L 288 155 Q 288 140 275 130 L 275 121 Z"/>

  <!-- Water at bottom of gas jar -->
  <path class="iwc-water" d="M 193 230 L 287 230 L 287 238 Q 287 243 282 243 L 198 243 Q 193 243 193 238 Z"/>

  <!-- Iron wire entering through gap -->
  <line class="iwc-wire" x1="240" y1="108" x2="240" y2="140"/>
  <!-- Spiral wire -->
  <path class="iwc-wire" d="M 240 140 Q 250 144 240 148 Q 230 152 240 156 Q 250 160 240 164 Q 230 168 240 172"/>
  <!-- Match stick at lower end of wire -->
  <line class="iwc-match" x1="240" y1="172" x2="240" y2="184"/>

  <!-- Brilliant combustion & sparks -->
  <!-- Bright center -->
  <circle cx="240" cy="180" r="5" fill="#fff9c4" stroke="#bf8d08" stroke-width="1.2"/>
  <!-- Sparks radiating -->
  <line class="iwc-spark" x1="232" y1="175" x2="218" y2="168"/>
  <line class="iwc-spark" x1="248" y1="175" x2="262" y2="166"/>
  <line class="iwc-spark" x1="232" y1="185" x2="216" y2="192"/>
  <line class="iwc-spark" x1="248" y1="185" x2="264" y2="194"/>
  <line class="iwc-spark" x1="240" y1="172" x2="240" y2="158"/>
  <line class="iwc-spark" x1="240" y1="188" x2="240" y2="202"/>
  <line class="iwc-spark" x1="234" y1="180" x2="222" y2="180"/>
  <line class="iwc-spark" x1="246" y1="180" x2="258" y2="180"/>

  <!-- Black molten beads Fe3O4 falling -->
  <circle cx="236" cy="210" r="1.8" class="iwc-bead"/>
  <circle cx="245" cy="222" r="2.2" class="iwc-bead"/>
  <circle cx="252" cy="238" r="2.5" class="iwc-bead"/>

  <!-- Labels on Apparatus -->
  <line class="iwc-lead" x1="248" y1="150" x2="295" y2="150"/>
  <circle cx="248" cy="150" r="2" class="iwc-dot"/>
  <text class="iwc-sub" x="300" y="154">螺旋细铁丝</text>

  <line class="iwc-lead" x1="264" y1="180" x2="295" y2="180"/>
  <circle cx="264" cy="180" r="2" class="iwc-dot"/>
  <text class="iwc-sub" x="300" y="184">火星四射</text>

  <line class="iwc-lead" x1="288" y1="236" x2="295" y2="236"/>
  <circle cx="288" cy="236" r="2" class="iwc-dot"/>
  <text class="iwc-sub" x="300" y="240">瓶底留少量水</text>

  <!-- Left Bottom Summary Card -->
  <rect class="iwc-sec-b" x="35" y="260" width="365" height="105"/>
  <text class="iwc-label" x="45" y="285">实验现象：剧烈燃烧，火星四射，放出大量热，生成黑色固体</text>
  <text class="iwc-sub" x="45" y="313">文字表达式：铁 ＋ 氧气 → 四氧化三铁（点燃）</text>
  <text class="iwc-sub" x="45" y="341">现象规范：只能描述为“生成黑色固体”，不得写物质名称</text>

  <!-- Right: 核心操作目的与易错点辨析 -->
  <rect class="iwc-card" x="425" y="62" width="330" height="314"/>
  <rect x="435" y="72" width="310" height="24" rx="3" fill="#fdf5f4"/>
  <text class="iwc-label" x="590" y="88" text-anchor="middle" fill="#c9554d">实验核心操作目的与易错点辨析</text>

  <!-- Card 1: 四个核心操作目的 -->
  <rect class="iwc-sec" x="435" y="106" width="310" height="125"/>
  <text class="iwc-label" x="445" y="126" fill="#c9554d">四个关键操作的目的：</text>
  <text class="iwc-sub" x="445" y="148">① 盘成螺旋状：增大铁丝受热面积与接触面积</text>
  <text class="iwc-sub" x="445" y="170">② 下端系火柴：引燃铁丝（提供着火点温度）</text>
  <text class="iwc-sub" x="445" y="192">③ 快燃尽时伸入：防火柴消耗过多集气瓶内氧气</text>
  <text class="iwc-sub" x="445" y="214">④ 瓶底留水或细沙：防高温熔融物溅落炸裂瓶底</text>

  <!-- Card 2: 常见易错考点 -->
  <rect class="iwc-sec-b" x="435" y="241" width="310" height="124"/>
  <text class="iwc-label" x="445" y="265" fill="#287fc4">常见易错与操作细节：</text>
  <text class="iwc-sub" x="445" y="291">• 现象规范：只能描述为黑色固体，不写物质名</text>
  <text class="iwc-sub" x="445" y="317">• 伸入操作：由上而下缓慢伸入，防氧气受热逸出</text>
  <text class="iwc-sub" x="445" y="343">• 瓶底防护：铺一层细沙可替代少量水，目的相同</text>
</svg>
