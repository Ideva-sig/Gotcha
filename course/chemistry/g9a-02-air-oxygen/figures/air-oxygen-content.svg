<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="aoc-t aoc-d">
  <title id="aoc-t">测定空气中氧气含量实验装置图</title>
  <desc id="aoc-d">展示红磷燃烧法测定空气中氧气含量的完整装置与冷却后水倒吸至集气瓶约五分之一刻度处的结果与要点分析。</desc>
  <style>
    .aoc-bg { fill: #ffffff; }
    .aoc-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
    .aoc-glass { fill: #f0f7fb; stroke: #52626a; stroke-width: 1.8; fill-opacity: 0.5; }
    .aoc-water { fill: #e1f5fe; stroke: #287fc4; stroke-width: 1.4; fill-opacity: 0.85; }
    .aoc-tube { fill: none; stroke: #287fc4; stroke-width: 2.2; stroke-linecap: round; }
    .aoc-rubber { fill: none; stroke: #bf8d08; stroke-width: 3.2; stroke-linecap: round; }
    .aoc-clamp { fill: #cfd8dc; stroke: #52626a; stroke-width: 1.2; }
    .aoc-spoon { fill: none; stroke: #78909c; stroke-width: 1.6; }
    .aoc-phosphorus { fill: #ef5350; stroke: #c9554d; stroke-width: 1.2; }
    .aoc-p2o5 { fill: #ffffff; stroke: #b0bec5; stroke-width: 1; }
    .aoc-tick { stroke: #52626a; stroke-width: 1.4; }
    .aoc-lead { fill: none; stroke: #7d8990; stroke-width: 1.2; stroke-dasharray: 2 2; }
    .aoc-dot { fill: #52626a; }
    .aoc-title { font: 600 15px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .aoc-label { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .aoc-sub { font: 400 12px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .aoc-eq { font: 600 12px -apple-system, "PingFang SC", sans-serif; fill: #287fc4; }
    .aoc-sec { fill: #fdf5f4; stroke: #c9554d; stroke-width: 1.2; rx: 4px; }
    .aoc-sec-b { fill: #f0f7fb; stroke: #287fc4; stroke-width: 1.2; rx: 4px; }
    .aoc-table { stroke: #52626a; stroke-width: 2; }
  </style>
  <rect class="aoc-bg" width="780" height="410"/>

  <!-- Top Title Banner -->
  <rect class="aoc-card" x="25" y="14" width="730" height="36"/>
  <text class="aoc-title" x="390" y="37" text-anchor="middle">实验探究：测定空气中氧气的含量（红磷燃烧法）</text>

  <!-- Left: 装置示意图与实验结果 -->
  <rect class="aoc-card" x="25" y="62" width="385" height="334"/>
  <rect x="35" y="72" width="365" height="24" rx="3" fill="#e1f5fe"/>
  <text class="aoc-label" x="217" y="88" text-anchor="middle" fill="#287fc4">实验装置与冷却倒吸结果（课本图 2-4）</text>

  <!-- Table surface -->
  <line class="aoc-table" x1="45" y1="285" x2="395" y2="285"/>

  <!-- Gas Jar (集气瓶): cx=115, w=72, y=130..285 -->
  <path class="aoc-glass" d="M 102 128 L 128 128 L 130 136 L 100 136 Z"/>
  <path class="aoc-glass" d="M 100 136 Q 79 145 79 165 L 79 278 Q 79 284 85 284 L 145 284 Q 151 284 151 278 L 151 165 Q 151 145 130 136 Z"/>

  <!-- Stopper -->
  <path d="M 104 118 L 126 118 L 124 128 L 106 128 Z" fill="#d7ccc8" stroke="#8d6e63" stroke-width="1.2"/>

  <!-- Sucked-in water at bottom of gas jar: reaches 1/5 line (y=245) -->
  <path class="aoc-water" d="M 80 245 L 150 245 L 150 278 Q 150 283 145 283 L 85 283 Q 80 283 80 278 Z"/>

  <!-- 5 Equal volume division marks on left wall of jar -->
  <line class="aoc-tick" x1="79" y1="165" x2="86" y2="165"/>
  <text x="73" y="169" font-size="10" fill="#52626a" text-anchor="end">5</text>
  <line class="aoc-tick" x1="79" y1="185" x2="86" y2="185"/>
  <text x="73" y="189" font-size="10" fill="#52626a" text-anchor="end">4</text>
  <line class="aoc-tick" x1="79" y1="205" x2="86" y2="205"/>
  <text x="73" y="209" font-size="10" fill="#52626a" text-anchor="end">3</text>
  <line class="aoc-tick" x1="79" y1="225" x2="86" y2="225"/>
  <text x="73" y="229" font-size="10" fill="#52626a" text-anchor="end">2</text>
  <line class="aoc-tick" x1="79" y1="245" x2="88" y2="245" stroke="#287fc4" stroke-width="2"/>
  <text x="73" y="249" font-size="10" font-weight="600" fill="#287fc4" text-anchor="end">1</text>
  <line class="aoc-tick" x1="79" y1="265" x2="86" y2="265"/>
  <text x="73" y="269" font-size="9" fill="#7d8990" text-anchor="end">原液面</text>

  <!-- Combustion Spoon -->
  <path class="aoc-spoon" d="M 111 112 L 111 205 L 123 205"/>
  <path d="M 119 205 Q 123 209 127 205 Z" fill="#b0bec5" stroke="#78909c" stroke-width="1"/>
  <circle cx="122" cy="203" r="1.8" class="aoc-phosphorus"/>
  <circle cx="124" cy="202" r="1.4" class="aoc-p2o5"/>

  <!-- Delivery Tube from gas jar to beaker -->
  <path class="aoc-tube" d="M 120 118 L 120 102 L 180 102"/>
  <line class="aoc-rubber" x1="180" y1="102" x2="215" y2="102"/>
  <rect class="aoc-clamp" x="192" y="96" width="12" height="12" rx="2"/>
  <circle cx="198" cy="94" r="3" fill="none" stroke="#52626a" stroke-width="1.2"/>
  <path class="aoc-tube" d="M 215 102 L 340 102 L 340 276"/>
  <polygon points="255,99 263,102 255,105" fill="#287fc4"/>

  <!-- Beaker at x=315..365, y=185..284 -->
  <path class="aoc-glass" d="M 315 185 L 315 280 Q 315 284 319 284 L 361 284 Q 365 284 365 280 L 365 185 Z"/>
  <path class="aoc-water" d="M 316 210 L 364 210 L 364 280 Q 364 283 361 283 L 319 283 Q 316 283 316 280 Z"/>

  <!-- Labels on Left Diagram (Carefully placed in open space) -->
  <text class="aoc-sub" x="198" y="122" text-anchor="middle">弹簧夹（打开）</text>

  <line class="aoc-lead" x1="127" y1="205" x2="160" y2="205"/>
  <circle cx="127" cy="205" r="2" class="aoc-dot"/>
  <text class="aoc-sub" x="165" y="209">燃烧匙（产物 五氧化二磷）</text>

  <line class="aoc-lead" x1="150" y1="245" x2="170" y2="245"/>
  <circle cx="150" cy="245" r="2" class="aoc-dot"/>
  <text class="aoc-sub" x="175" y="249">水面上升约 1/5</text>

  <line class="aoc-lead" x1="315" y1="230" x2="285" y2="230"/>
  <circle cx="315" cy="230" r="2" class="aoc-dot"/>
  <text class="aoc-sub" x="280" y="234" text-anchor="end">盛水烧杯</text>

  <!-- Left Bottom Box -->
  <rect class="aoc-sec-b" x="35" y="298" width="365" height="86"/>
  <text class="aoc-label" x="45" y="322">实验结论：氧气约占空气总体积的 1/5</text>
  <text class="aoc-sub" x="45" y="346">反应原理：红磷 ＋ 氧气 → 五氧化二磷（消耗氧气，压强减小）</text>
  <text class="aoc-sub" x="45" y="370">剩余气体：主要是氮气，难溶于水，不支持燃烧</text>

  <!-- Right: 核心分析与注意事项卡片 -->
  <rect class="aoc-card" x="425" y="62" width="330" height="334"/>
  <rect x="435" y="72" width="310" height="24" rx="3" fill="#fdf5f4"/>
  <text class="aoc-label" x="590" y="88" text-anchor="middle" fill="#c9554d">实验成败关键与误差分析</text>

  <!-- Card 1: 实验成功的三个关键 -->
  <rect class="aoc-sec" x="435" y="106" width="310" height="120"/>
  <text class="aoc-label" x="445" y="126" fill="#c9554d">实验成功的关键要点：</text>
  <text class="aoc-sub" x="445" y="148">① 红磷必须足量：保证完全耗尽集气瓶内的氧气</text>
  <text class="aoc-sub" x="445" y="170">② 装置气密性良好：防止瓶外空气漏入导致读数偏小</text>
  <text class="aoc-sub" x="445" y="192">③ 完全冷却后再打开夹子：防残余气体受热膨胀</text>
  <text class="aoc-sub" x="445" y="214">④ 点燃后迅速伸入并塞紧：防止瓶内气体受热逸出</text>

  <!-- Card 2: 常见误差原因对比 -->
  <rect class="aoc-sec-b" x="435" y="236" width="310" height="148"/>
  <text class="aoc-label" x="445" y="256" fill="#287fc4">导致测定结果偏差的常见原因：</text>
  <text class="aoc-label" x="445" y="278" font-size="12" fill="#c9554d">【测得偏小（小于 1/5）】</text>
  <text class="aoc-sub" x="445" y="298">• 红磷量不足，瓶内氧气未完全耗尽</text>
  <text class="aoc-sub" x="445" y="316">• 装置漏气；未完全冷却至室温即打开弹簧夹</text>
  <text class="aoc-label" x="445" y="338" font-size="12" fill="#197a60">【测得偏大（大于 1/5）】</text>
  <text class="aoc-sub" x="445" y="358">• 点燃红磷后伸入过慢，瓶塞塞紧前部分气体逸出</text>
  <text class="aoc-sub" x="445" y="376">• 实验前弹簧夹未夹紧，燃烧放热导致气体逸出</text>
</svg>
