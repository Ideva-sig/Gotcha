<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" role="img" aria-labelledby="oatom-t oatom-d">
  <title id="oatom-t">氧原子的结构示意图</title>
  <desc id="oatom-d">圆圈表示原子核，圈内正数+8表示核内质子数；弧线表示电子层，弧线上的数字表示该层电子数。</desc>
  <style>
    .oatom-bg { fill: #ffffff; }
    .oatom-circle { fill: #fdf5f4; stroke: #c9554d; stroke-width: 2.2; }
    .oatom-arc { fill: none; stroke: #287fc4; stroke-width: 2.2; }
    .oatom-lead { fill: none; stroke: #52626a; stroke-width: 1.6; stroke-dasharray: 3 3; }
    .oatom-ptr { fill: #52626a; }
    .oatom-t1 { font: 600 19px -apple-system, "PingFang SC", sans-serif; fill: #c9554d; }
    .oatom-t2 { font: 600 18px -apple-system, "PingFang SC", sans-serif; fill: #287fc4; }
    .oatom-label { font: 600 14px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .oatom-sub { font: 400 12px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .oatom-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
  </style>
  <rect class="oatom-bg" width="540" height="280"/>

  <!-- Left: Oxygen Atom Schematic -->
  <!-- Nucleus Circle: cx=160, cy=140, r=26 -->
  <circle class="oatom-circle" cx="160" cy="140" r="26"/>
  <text class="oatom-t1" x="160" y="147" text-anchor="middle">+8</text>

  <!-- Shell 1 Arc: r=60, upper and lower arcs with gap for number 2 -->
  <path class="oatom-arc" d="M 206 102 A 60 60 0 0 1 218 128"/>
  <path class="oatom-arc" d="M 218 152 A 60 60 0 0 1 206 178"/>
  <rect x="211" y="130" width="18" height="20" fill="#ffffff"/>
  <text class="oatom-t2" x="220" y="146" text-anchor="middle">2</text>

  <!-- Shell 2 Arc: r=96, upper and lower arcs with gap for number 6 -->
  <path class="oatom-arc" d="M 238 84 A 96 96 0 0 1 254 126"/>
  <path class="oatom-arc" d="M 254 154 A 96 96 0 0 1 238 196"/>
  <rect x="247" y="130" width="18" height="20" fill="#ffffff"/>
  <text class="oatom-t2" x="256" y="146" text-anchor="middle">6</text>

  <!-- Callouts and Leader Lines -->
  <!-- 1. Nucleus leader (up-left) -->
  <path class="oatom-lead" d="M 160 114 L 160 70 L 105 70"/>
  <circle cx="160" cy="114" r="2.5" class="oatom-ptr"/>
  <text class="oatom-label" x="98" y="55" text-anchor="end">原子核</text>
  <text class="oatom-sub" x="98" y="74" text-anchor="end">圆圈表示原子核</text>

  <!-- 2. Proton number leader (down-left) -->
  <path class="oatom-lead" d="M 160 166 L 160 210 L 105 210"/>
  <circle cx="160" cy="166" r="2.5" class="oatom-ptr"/>
  <text class="oatom-label" x="98" y="205" text-anchor="end">核内质子数</text>
  <text class="oatom-sub" x="98" y="224" text-anchor="end">“+”表示带正电</text>

  <!-- 3. Electron shell leader (up-right) -->
  <path class="oatom-lead" d="M 206 114 L 206 60 L 290 60"/>
  <circle cx="206" cy="114" r="2.5" class="oatom-ptr"/>
  <text class="oatom-label" x="298" y="55">电子层（弧线）</text>
  <text class="oatom-sub" x="298" y="74">离核最近为第一层，向外依次递增</text>

  <!-- 4. Number of electrons leader (down-right) -->
  <path class="oatom-lead" d="M 260 156 L 260 220 L 290 220"/>
  <circle cx="260" cy="156" r="2.5" class="oatom-ptr"/>
  <text class="oatom-label" x="298" y="215">各层电子数（数字）</text>
  <text class="oatom-sub" x="298" y="234">第一层 2 个，最外层 6 个</text>

  <!-- Right side note card -->
  <rect class="oatom-card" x="375" y="105" width="150" height="70"/>
  <text class="oatom-label" x="450" y="128" text-anchor="middle">最外层电子数 = 6</text>
  <text class="oatom-sub" x="450" y="148" text-anchor="middle">大于 4，化学反应中</text>
  <text class="oatom-sub" x="450" y="164" text-anchor="middle" fill="#c9554d">易得到 2 个电子</text>
</svg>
