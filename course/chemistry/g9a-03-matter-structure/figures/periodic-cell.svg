<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="pcell-t pcell-d">
  <title id="pcell-t">元素周期表单元格通用示意图</title>
  <desc id="pcell-d">元素周期表单元格中，左上角为原子序数，右上角为元素符号，中间为元素名称，下方为相对原子质量。</desc>
  <style>
    .pcell-bg { fill: #ffffff; }
    .pcell-box { fill: #fdfbf7; stroke: #287fc4; stroke-width: 2.2; rx: 6px; }
    .pcell-lead { fill: none; stroke: #7d8990; stroke-width: 1.6; stroke-dasharray: 4 4; }
    .pcell-dot { fill: #287fc4; }
    .pcell-num { font: 600 22px -apple-system, "PingFang SC", sans-serif; fill: #287fc4; }
    .pcell-sym { font: 700 28px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .pcell-name { font: 700 38px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .pcell-mass { font: 600 19px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .pcell-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
    .pcell-tag { font: 600 14px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .pcell-desc { font: 400 12px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .pcell-emph { fill: #c9554d; font-weight: 600; }
  </style>
  <rect class="pcell-bg" width="600" height="300"/>

  <!-- Center Unit Cell (x=215, y=45, w=170, h=190) -->
  <rect class="pcell-box" x="215" y="45" width="170" height="190"/>
  <text class="pcell-num" x="235" y="76">26</text>
  <text class="pcell-sym" x="365" y="78" text-anchor="end">Fe</text>
  <text class="pcell-name" x="300" y="145" text-anchor="middle">铁</text>
  <text class="pcell-mass" x="300" y="212" text-anchor="middle">55.85</text>

  <!-- Left-Top Callout: Atomic Number -->
  <path class="pcell-lead" d="M 215 70 L 175 70"/>
  <circle class="pcell-dot" cx="215" cy="70" r="3"/>
  <rect class="pcell-card" x="20" y="32" width="155" height="68"/>
  <text class="pcell-tag" x="30" y="54">原子序数（26）</text>
  <text class="pcell-desc" x="30" y="73">= 核电荷数 = 质子数</text>
  <text class="pcell-desc" x="30" y="89">= 核外电子数（中性原子）</text>

  <!-- Right-Top Callout: Element Symbol -->
  <path class="pcell-lead" d="M 385 70 L 425 70"/>
  <circle class="pcell-dot" cx="385" cy="70" r="3"/>
  <rect class="pcell-card" x="425" y="32" width="155" height="68"/>
  <text class="pcell-tag" x="435" y="54">元素符号（Fe）</text>
  <text class="pcell-desc" x="435" y="73">国际通用拉丁文缩写</text>
  <text class="pcell-desc" x="435" y="89">首字母大写，第二个小写</text>

  <!-- Left-Bottom Callout: Element Name -->
  <path class="pcell-lead" d="M 270 135 L 175 165"/>
  <circle class="pcell-dot" cx="270" cy="135" r="3"/>
  <rect class="pcell-card" x="20" y="140" width="155" height="72"/>
  <text class="pcell-tag" x="30" y="162">元素名称（铁）</text>
  <text class="pcell-desc" x="30" y="181">汉字偏旁反映元素类别</text>
  <text class="pcell-desc" x="30" y="198">“钅”字旁代表<tspan class="pcell-emph">金属元素</tspan></text>

  <!-- Right-Bottom Callout: Relative Atomic Mass -->
  <path class="pcell-lead" d="M 355 208 L 425 185"/>
  <circle class="pcell-dot" cx="355" cy="208" r="3"/>
  <rect class="pcell-card" x="425" y="140" width="155" height="88"/>
  <text class="pcell-tag" x="435" y="162">相对原子质量（55.85）</text>
  <text class="pcell-desc" x="435" y="181">以碳-12的 1/12 为标准</text>
  <text class="pcell-desc" x="435" y="198">所得的比值，单位为“1”</text>
  <text class="pcell-desc" x="435" y="215" fill="#c9554d">通常省略不写，不能带“g”</text>

  <!-- Bottom Tip Banner -->
  <rect x="180" y="255" width="240" height="28" rx="4" fill="#f4f8fb" stroke="#bec9ce" stroke-width="1.2"/>
  <text class="pcell-desc" x="300" y="274" text-anchor="middle" font-weight="500">原子序数 = 核内质子数 = 26</text>
</svg>
