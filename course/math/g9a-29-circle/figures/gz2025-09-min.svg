  <path d="M280 312L401.2 102" stroke="#c9554d" stroke-width="2.6" stroke-dasharray="7 6"/>
  <path d="M280 32L401.2 102" stroke="#52626a" stroke-width="2.6"/>
  <path d="M360.8 172L280 32" stroke="#287fc4" stroke-width="2.6"/>
