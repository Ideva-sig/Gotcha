  <title id="gz2025-09-min-t">P 在使三角形 PCD 周长最小的位置</title>
  <desc id="gz2025-09-min-d">圆 O 的直径 AB=4，C 为半圆弧中点，D 在弧 BC 上且角 BOD=30°。作 C 关于 AB 的对称点 C′，连接 C′D 交 AB 于 P，此时 PC=PC′，三角形 PCD 周长最小。PC 蓝、PD 绿、CD 灰，C′D 珊瑚红虚线。静态图。</desc>
