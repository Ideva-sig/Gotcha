<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="bridge-radius-29-2b-t bridge-radius-29-2b-d">
  <title id="bridge-radius-29-2b-t">桥拱半径与平行弦的位置</title>
  <desc id="bridge-radius-29-2b-d">上方三步：桥拱弧AB与拱高CD；连接OA并作OD垂直AB；突出直角三角形OAD。蓝色半弦AD=18.5，绿色弦心距OD=R−7.23，灰色半径OA=R，勾股方程三项同色对应。下方无数值小图分别表示平行弦在圆心同侧和两侧，不显示练习的数值或结果。无动画。</desc>
  <style>.bridge-radius-29-2b-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.bridge-radius-29-2b-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
