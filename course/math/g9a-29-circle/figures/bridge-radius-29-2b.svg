  <text class="bridge-radius-29-2b-formula" x="120" y="283" text-anchor="middle" style="font-family:Times New Roman, PingFang SC, serif;font-size:18px;font-weight:500;fill:#20272b;stroke:none"><tspan fill="#52626a"><tspan font-style="italic">C</tspan><tspan font-style="italic">D</tspan> = 7.23</tspan></text>
