  <title id="cv-272b-t">反比例函数读值范围与函数值比较</title>
  <desc id="cv-272b-d">第一栏由点(−2,−4)求得k=8与解析式y=8/x。第二栏在y=8/x上画水平线y=4，展示y小于4对应的两段图段：x小于0与x大于2（端点均为空心）。第三栏比较三点A(−3,y₁)、B(−5,y₂)、C(4,y₃)的纵坐标，得出y₁小于y₂小于y₃。</desc>
  <style>.cv-272b-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.cv-272b-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
