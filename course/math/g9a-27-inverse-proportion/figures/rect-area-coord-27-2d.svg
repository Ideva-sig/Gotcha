  <g data-step="1">
  <text class="rac-272d-lb" x="380" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">GD2024第23题(1) 坐标与面积推导</text>
  <text class="rac-272d-math" x="380" y="70" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1. 由矩形边平行于坐标轴写出各点坐标：</tspan></text>
  <text class="rac-272d-math" x="405" y="96" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">设 </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">B</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">, </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">am</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">，其中 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> &gt; 0，</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> &gt; 0</tspan></text>
  <text class="rac-272d-math" x="405" y="124" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 与 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">B</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 横坐标相同，且 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 在双曲线上：</tspan></text>
  <text class="rac-272d-math" x="425" y="148" text-anchor="start" style="font-size:16px;font-weight:600;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">, </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="2">
  <text class="rac-272d-math" x="405" y="180" text-anchor="start" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">AD</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> // </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 轴，</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">D</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 的纵坐标为 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">；又 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">D</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 在直线 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">=</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">ax</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 上：</tspan></text>
  <text class="rac-272d-math" x="425" y="206" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">ax</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">  ⇒  </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">am</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="rac-272d-math" x="425" y="232" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">故 </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">D</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">am</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">), </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="3">
  <text class="rac-272d-math" x="405" y="266" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">C</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 与 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">D</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 同横坐标、与 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">B</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 同纵坐标：</tspan></text>
  <text class="rac-272d-math" x="425" y="292" text-anchor="start" style="font-size:16px;font-weight:700;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">C</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">am</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">, </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">am</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="4">
  <text class="rac-272d-math" x="380" y="332" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2. 坐标矩形面积恒等与验证：</tspan></text>
  <text class="rac-272d-math" x="405" y="358" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">矩形 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">O</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">-</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 面积：</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> · (</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">m</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) = </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">k</tspan></text>
  <text class="rac-272d-math" x="405" y="384" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">矩形 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">O</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">-</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">C</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 面积：</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">am</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)) · (</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">am</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) = </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">k</tspan></text>
  <rect x="395" y="398" width="305" height="36" rx="5" fill="#f0fdf4" stroke="#197a60" stroke-width="1.5"/>
  <text class="rac-272d-math" x="547" y="422" text-anchor="middle" style="font-size:14px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">C</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 点横纵坐标乘积为 </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">  ⇒  </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">C</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 在双曲线上！</tspan></text>
  </g>
