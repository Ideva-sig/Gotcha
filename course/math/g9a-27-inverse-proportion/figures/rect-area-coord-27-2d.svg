  <text class="rac-272d-math" x="310" y="297.6" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
