<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="rac-272d-t rac-272d-d">
  <title id="rac-272d-t">矩形边平行于坐标轴时的坐标与面积关系</title>
  <desc id="rac-272d-d">左侧直角坐标系展示直线y=ax与双曲线y=k/x(第一象限)。矩形ABCD对角线BD在直线上，AD平行于x轴。展示以原点为顶点的两个坐标轴矩形O-A与O-C面积均为k。右侧展示推导：由坐标关系得C点坐标为(k/(am),am)，其横纵坐标乘积恒为k，证明点C必在反比例函数y=k/x的图象上。</desc>
  <style>.rac-272d-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.rac-272d-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
