  <title id="mdf-273b-t">电子屏幕数据反比例模型拟合与估计</title>
  <desc id="mdf-273b-d">左侧展示课本电子屏幕尺寸x与像素密度y的数据表及乘积xy列表，各组乘积均接近2200，说明适合近似反比例模型y=2200/x。右侧坐标系展示5个蓝色数据散点与绿色拟合双曲线y=2200/x，并用虚线投影展示当像素密度为40 PPI时估计尺寸约为55英寸。</desc>
