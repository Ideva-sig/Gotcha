  <path d="M260 230L260 170" stroke="#287fc4" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M180 170L260 170" stroke="#287fc4" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <circle cx="260" cy="170" r="4.5" fill="#287fc4"/>
  <text class="ifk-271b-math" x="268" y="164" text-anchor="start" style="font-size:15px;font-weight:700;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(4, 3)</tspan></text>
  <g data-step="1">
  <text class="ifk-271b-lb" x="380" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">待定系数法四步推导</text>
  <text class="ifk-271b-math" x="380" y="70" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1. 设解析式与已知点：</tspan></text>
  <text class="ifk-271b-math" x="405" y="98" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">设 </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> / </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">，已知点 </tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(2, 6)</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 在图象上</tspan></text>
  </g>
  <g data-step="2">
  <text class="ifk-271b-math" x="380" y="138" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2. 代入坐标求系数 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">：</tspan></text>
  <text class="ifk-271b-math" x="405" y="168" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">代入得：</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">6 = </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> / 2</tspan></text>
  <text class="ifk-271b-math" x="405" y="198" text-anchor="start" style="font-size:17px;font-weight:700;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">解得：</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">k</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 2 × 6 = 12</tspan></text>
  </g>
  <g data-step="3">
  <text class="ifk-271b-math" x="380" y="240" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3. 写回函数解析式：</tspan></text>
  <rect x="400" y="255" width="180" height="46" rx="6" fill="#f0fdf4" stroke="#197a60" stroke-width="2"/>
  <text class="ifk-271b-math" x="490" y="285" text-anchor="middle" style="font-size:20px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 12 / </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="ifk-271b-math" x="405" y="322" text-anchor="start" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">双曲线两支分别位于第一、三象限</tspan></text>
  </g>
  <g data-step="4">
  <text class="ifk-271b-math" x="380" y="355" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">4. 代入求值与检验点：</tspan></text>
  <text class="ifk-271b-math" x="405" y="385" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">当 </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 4 时，</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 12 / 4 = 3</tspan></text>
  <text class="ifk-271b-math" x="405" y="415" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">得到点 </tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(4, 3)</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">；两点横纵坐标乘积均为 12</tspan></text>
  </g>
</svg>
