  <path d="M216 96.7L218 103.7L220 110L222 115.7L224 120.9L226 125.7L228 130L230 134L232 137.7L234 141.1L236 144.3L238 147.2L240 150L242 152.6L244 155L246 157.3L248 159.4L250 161.4L252 163.3L254 165.1L256 166.8L258 168.5L260 170L262 171.5L264 172.9L266 174.2L268 175.5L270 176.7L272 177.8L274 178.9L276 180L278 181L280 182L282 182.9L284 183.8L286 184.7L288 185.6L290 186.4L292 187.1L294 187.9L296 188.6L298 189.3L300 190L302 190.7L304 191.3L306 191.9L308 192.5L310 193.1" stroke="#197a60" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
  <path d="M50 266.9L52 267.5L54 268.1L56 268.7L58 269.3L60 270L62 270.7L64 271.4L66 272.1L68 272.9L70 273.6L72 274.4L74 275.3L76 276.2L78 277.1L80 278L82 279L84 280L86 281.1L88 282.2L90 283.3L92 284.5L94 285.8L96 287.1L98 288.5L100 290L102 291.5L104 293.2L106 294.9L108 296.7L110 298.6L112 300.6L114 302.7L116 305L118 307.4L120 310L122 312.8L124 315.7L126 318.9L128 322.3L130 326L132 330L134 334.3L136 339.1L138 344.3L140 350L142 356.3L144 363.3" stroke="#197a60" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
