  <text class="ifk-271b-math" x="260" y="246" text-anchor="middle" style="font-size:12px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">4</tspan></text>
