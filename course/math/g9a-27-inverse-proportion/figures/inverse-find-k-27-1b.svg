<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="ifk-271b-t ifk-271b-d">
  <title id="ifk-271b-t">待定系数法求反比例解析式及检验点</title>
  <desc id="ifk-271b-d">左侧直角坐标系展示反比例函数y=12/x的双曲线两支，标出已知点(2,6)与检验点(4,3)及其虚线投影。右侧展示四步推导：第一步由点(2,6)在曲线上；第二步代入算得k=2×6=12；第三步写出解析式y=12/x；第四步代入x=4算出y=3，验证两点乘积恒为12。</desc>
