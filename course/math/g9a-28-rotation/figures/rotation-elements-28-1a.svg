<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="rotation-elements-28-1a-t rotation-elements-28-1a-d">
  <title id="rotation-elements-28-1a-t">旋转的三要素：旋转中心、方向与旋转角</title>
  <desc id="rotation-elements-28-1a-d">左侧取坐标系原点O(0,0)为旋转中心，P(3,0)绕O逆时针旋转角θ=60°得到对应点P'，保留线段OP与OP'，角弧外标逆时针箭头；右侧列出旋转中心、旋转方向、旋转角三要素，及OP=OP'、∠POP'=θ对应性质。图与旁式的θ均用蓝色，点O用线框色。</desc>
  <style>.rotation-elements-28-1a-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.rotation-elements-28-1a-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="420" fill="#fff" stroke="none"/>
  <path d="M45 275L364.4 275" stroke="#52626a" stroke-width="1.3" stroke-linecap="butt"/>
  <path d="M370 275L363 278.1L363 271.9Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <path d="M160 375L160 50.6" stroke="#52626a" stroke-width="1.3" stroke-linecap="butt"/>
  <path d="M160 45L163.2 52L156.8 52Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="rotation-elements-28-1a-math" x="382" y="280" text-anchor="start" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="rotation-elements-28-1a-math" x="150" y="36" text-anchor="start" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan></text>
  <text class="rotation-elements-28-1a-math" x="146" y="295" text-anchor="end" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#52626a" font-family="Times New Roman,serif" font-style="italic">O</tspan></text>
  <path d="M235 145.1A150 150 0 0 1 310 275" fill="none" stroke="#bec9ce" stroke-width="1.4"/>
  <path d="M160 275L310 275" stroke="#287fc4" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M160 275L235 145.1" stroke="#287fc4" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M233 271L233 279" stroke="#287fc4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M237 271L237 279" stroke="#287fc4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M193 209.8L200 213.8" stroke="#287fc4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M195 206.3L202 210.3" stroke="#287fc4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M184 233.4A48 48 0 0 1 208 275" fill="none" stroke="#287fc4" stroke-width="1.8"/>
  <text class="rotation-elements-28-1a-math" x="220" y="251" text-anchor="start" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">θ</tspan></text>
  <path d="M202.4 232.6L210.6 235.7L205.5 240.8Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <circle cx="160" cy="275" r="4.0" fill="#52626a"/>
  <circle cx="310" cy="275" r="3.8" fill="#20272b"/>
  <circle cx="235" cy="145.1" r="3.8" fill="#20272b"/>
  <text class="rotation-elements-28-1a-math" x="310" y="297" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">P</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(3, 0)</tspan></text>
  <text class="rotation-elements-28-1a-math" x="243" y="139.1" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">P</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′</tspan></text>
  <rect x="400" y="42" width="295" height="348" rx="8" fill="#fdfefe" stroke="#bec9ce" stroke-width="1.2"/>
  <text class="rotation-elements-28-1a-lb" x="420" y="76" text-anchor="start" style="fill:#20272b;font-size:18px;font-weight:700">旋转的三要素</text>
  <path d="M420 92L675 92" stroke="#bec9ce" stroke-width="1" stroke-linecap="round"/>
  <text class="rotation-elements-28-1a-lb" x="420" y="126" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:600">① 旋转中心：</text>
  <text class="rotation-elements-28-1a-math" x="530" y="126" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">定点 </tspan><tspan fill="#52626a" font-family="Times New Roman,serif" font-style="italic">O</tspan><tspan fill="#52626a" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(0, 0)</tspan></text>
  <text class="rotation-elements-28-1a-lb" x="420" y="168" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:600">② 旋转方向：</text>
  <text class="rotation-elements-28-1a-lb" x="530" y="168" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:600">逆时针方向</text>
  <text class="rotation-elements-28-1a-lb" x="420" y="210" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:600">③ 旋转角：</text>
  <text class="rotation-elements-28-1a-math" x="530" y="210" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">转角 </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">θ</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">（∠</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">POP</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′ = </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">θ</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">）</tspan></text>
  <path d="M420 236L675 236" stroke="#bec9ce" stroke-width="1" stroke-linecap="round"/>
  <text class="rotation-elements-28-1a-lb" x="420" y="266" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:600">对应性质：</text>
  <text class="rotation-elements-28-1a-math" x="420" y="298" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">• 对应点到中心距离相等：</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">OP</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">OP</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′</tspan></text>
  <text class="rotation-elements-28-1a-math" x="420" y="328" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">• 连线所成的角等于旋转角：</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">∠</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">POP</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′ = </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">θ</tspan></text>
  <text class="rotation-elements-28-1a-math" x="420" y="358" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">• 点 </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">P</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 与点 </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">P</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 互为对应点</tspan></text>
</svg>
