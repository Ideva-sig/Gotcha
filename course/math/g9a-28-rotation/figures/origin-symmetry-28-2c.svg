  <text class="origin-symmetry-28-2c-math" x="485" y="122" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">• 横向投影 </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 3</tspan></text>
  <text class="origin-symmetry-28-2c-math" x="485" y="146" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">• 纵向投影 </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 1</tspan></text>
