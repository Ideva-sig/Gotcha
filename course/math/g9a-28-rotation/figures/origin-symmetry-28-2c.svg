  <title id="origin-symmetry-28-2c-t">关于原点对称的点的坐标规律</title>
  <desc id="origin-symmetry-28-2c-d">第一步描出点A(3,1)及到两轴的投影；第二步连结AA'并反向等长延长到A'(-3,-1)，经过原点O且OA=OA'；第三步作A'到两轴投影，横坐标3到-3标蓝色短箭头，纵坐标1到-1标绿色短箭头，归纳出(x,y)到(-x,-y)的规律。数轴负号逐个核对，不用本图颜色表示正确或错误。</desc>
