<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="db-252c-t db-252c-d">
  <title id="db-252c-t">判别式与一元二次方程根的情况</title>
  <desc id="db-252c-d">起点为一般形式ax²+bx+c=0(a≠0)，配方得到(x+b/(2a))²=Δ/(4a²)。因为4a²恒大于0，等号右边的正负完全由判别式Δ=b²−4ac决定。分为三列：Δ>0有两个不相等的实数根；Δ=0有两个相等的实数根；Δ&lt;0无实数根。</desc>
  <style>.db-252c-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.db-252c-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="420" fill="#fff" stroke="none"/>
  <g data-step="1">
  <rect x="170" y="15" width="380" height="68" rx="6" fill="#f8fafc" stroke="#52626a" stroke-width="1.5"/>
  <text class="db-252c-math" x="360" y="42" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">ax</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² + </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">bx</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">c</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 0  (</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ≠ 0)</tspan></text>
  <text class="db-252c-math" x="360" y="68" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">配方推导：</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">))² = Δ / (4</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">²)</tspan></text>
  <text class="db-252c-math" x="360" y="108" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">其中判别式 </tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">Δ = </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² − 4</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">ac</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">；因 4</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² &gt; 0，右侧符号由 Δ 决定</tspan></text>
  <path d="M360 120L136.3 154" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M130 155L137.4 150.2L138.5 157.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <path d="M360 120L360 148.6" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M360 155L356.4 147L363.6 147Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <path d="M360 120L583.7 154" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M590 155L581.5 157.4L582.6 150.2Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  </g>
  <g data-step="2">
  <rect x="30" y="165" width="200" height="235" rx="8" fill="#f0f9ff" stroke="#287fc4" stroke-width="1.5"/>
  <text class="db-252c-math" x="130" y="195" text-anchor="middle" style="font-size:22px;font-weight:700;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">Δ &gt; 0</tspan></text>
  <text class="db-252c-math" x="130" y="225" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">右侧大于 0</tspan></text>
  <text class="db-252c-math" x="130" y="255" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) = ±√Δ / (2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="db-252c-math" x="130" y="310" text-anchor="middle" style="font-size:16px;font-weight:700;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">有两个不相等的</tspan></text>
  <text class="db-252c-math" x="130" y="335" text-anchor="middle" style="font-size:16px;font-weight:700;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">实数根</tspan></text>
  <text class="db-252c-math" x="130" y="375" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = (−</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ± √Δ)/(2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="3">
  <rect x="260" y="165" width="200" height="235" rx="8" fill="#f0fdf4" stroke="#197a60" stroke-width="1.5"/>
  <text class="db-252c-math" x="360" y="195" text-anchor="middle" style="font-size:22px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">Δ = 0</tspan></text>
  <text class="db-252c-math" x="360" y="225" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">右侧等于 0</tspan></text>
  <text class="db-252c-math" x="360" y="255" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) = 0</tspan></text>
  <text class="db-252c-math" x="360" y="310" text-anchor="middle" style="font-size:16px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">有两个相等的</tspan></text>
  <text class="db-252c-math" x="360" y="335" text-anchor="middle" style="font-size:16px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">实数根</tspan></text>
  <text class="db-252c-math" x="360" y="375" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">₁ = </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">₂ = −</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">/(2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="4">
  <rect x="490" y="165" width="200" height="235" rx="8" fill="#fef2f2" stroke="#c9554d" stroke-width="1.5"/>
  <text class="db-252c-math" x="590" y="195" text-anchor="middle" style="font-size:22px;font-weight:700;stroke:none"><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">Δ &lt; 0</tspan></text>
  <text class="db-252c-math" x="590" y="225" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">右侧小于 0</tspan></text>
  <text class="db-252c-math" x="590" y="255" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">负数没有实数平方根</tspan></text>
  <text class="db-252c-math" x="590" y="320" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">没有实数根</tspan></text>
  <text class="db-252c-math" x="590" y="350" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">（无实根）</tspan></text>
  <text class="db-252c-math" x="590" y="380" text-anchor="middle" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">在实数范围内无解</tspan></text>
  </g>
</svg>
