<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="cs-252b-t cs-252b-d">
  <title id="cs-252b-t">配方法的几何拼面积与代数两边同加</title>
  <desc id="cs-252b-d">左侧展示课本x²+6x+4=0在x>0时的几何拼面积：蓝色x×x正方形与两块黄色3×x矩形拼成L形，补上绿色3×3小正方形后拼成边长x+3的大正方形，面积为(x+3)²。右侧展示对应的代数步骤：移项得x²+6x=−4，两边同加9配成(x+3)²=5，降次解得x=−3±√5。</desc>
  <style>.cs-252b-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.cs-252b-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="430" fill="#fff" stroke="none"/>
  <path d="M365 30L365 400" stroke="#bec9ce" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <g data-step="1">
  <text class="cs-252b-lb" x="35" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">几何拼面积（x > 0 示意）</text>
  <rect x="70" y="75" width="120" height="120" rx="0" fill="#e0f2fe" stroke="#287fc4" stroke-width="2"/>
  <text class="cs-252b-math" x="130" y="142" text-anchor="middle" style="font-size:22px;font-weight:700;stroke:none"><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">²</tspan></text>
  <rect x="190" y="75" width="48" height="120" rx="0" fill="#fef9c3" stroke="#bf8d08" stroke-width="2"/>
  <text class="cs-252b-math" x="214" y="142" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <rect x="70" y="195" width="120" height="48" rx="0" fill="#fef9c3" stroke="#bf8d08" stroke-width="2"/>
  <text class="cs-252b-math" x="130" y="226" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  </g>
  <g data-step="2">
  <text class="cs-252b-math" x="130" y="62" text-anchor="middle" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="cs-252b-math" x="214" y="62" text-anchor="middle" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan></text>
  <text class="cs-252b-math" x="52" y="142" text-anchor="middle" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="cs-252b-math" x="52" y="226" text-anchor="middle" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan></text>
  <text class="cs-252b-math" x="195" y="290" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">右下角补上 3×3 的小正方形</tspan></text>
  </g>
  <g data-step="3">
  <rect x="190" y="195" width="48" height="48" rx="0" fill="#dcfce7" stroke="#197a60" stroke-width="2"/>
  <text class="cs-252b-math" x="214" y="226" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">9</tspan></text>
  <text class="cs-252b-math" x="175" y="335" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² + 6</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 9 = (</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 3)²</tspan></text>
  <text class="cs-252b-math" x="175" y="368" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">补齐为边长 (</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+3) 的大正方形</tspan></text>
  </g>
  <g data-step="4">
  <text class="cs-252b-lb" x="395" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">代数解方程（两边同加 9）</text>
  <text class="cs-252b-math" x="395" y="75" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">原方程：</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² + 6</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 4 = 0</tspan></text>
  <text class="cs-252b-math" x="395" y="115" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1. 移常数项：</tspan></text>
  <text class="cs-252b-math" x="420" y="145" text-anchor="start" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² + 6</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = −4</tspan></text>
  <text class="cs-252b-math" x="395" y="185" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2. 等式两边同时加上 9：</tspan></text>
  <text class="cs-252b-math" x="420" y="218" text-anchor="start" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² + 6</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">9</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = −4 + </tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">9</tspan></text>
  <text class="cs-252b-math" x="420" y="245" text-anchor="start" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">一次项系数 6 的一半的平方是 3²=9</tspan></text>
  <text class="cs-252b-math" x="395" y="280" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3. 左边配方，右边合并：</tspan></text>
  <text class="cs-252b-math" x="420" y="312" text-anchor="start" style="font-size:18px;font-weight:600;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 3</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)² = 5</tspan></text>
  <text class="cs-252b-math" x="395" y="348" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">4. 直接开平方降次：</tspan></text>
  <rect x="415" y="362" width="230" height="45" rx="6" fill="#f0fdf4" stroke="#197a60" stroke-width="1.8"/>
  <text class="cs-252b-math" x="530" y="391" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = −3 ± √5</tspan></text>
  </g>
</svg>
