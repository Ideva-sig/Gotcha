<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="pf-253a-t pf-253a-d">
  <title id="pf-253a-t">相框面积关系与一元二次方程列式</title>
  <desc id="pf-253a-d">左侧展示照片与等宽相框的几何关系：内矩形尺寸22×29cm，四周边框等宽x，外矩形总尺寸为(22+2x)×(29+2x)cm。浅黄色区域为相框边。右侧展示面积方程推导：内面积638，外面积(22+2x)(29+2x)，框边面积为外减内等于照片的1/4，解方程得有效正根x≈1.5cm。</desc>
  <style>.pf-253a-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.pf-253a-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="440" fill="#fff" stroke="none"/>
  <path d="M335 30L335 410" stroke="#bec9ce" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <g data-step="1">
  <text class="pf-253a-lb" x="35" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">相框几何尺寸（等宽 x）</text>
  <rect x="65" y="80" width="170" height="210" rx="0" fill="#fef9c3" stroke="#52626a" stroke-width="1.5"/>
  <rect x="85" y="100" width="130" height="170" rx="0" fill="#ffffff" stroke="#287fc4" stroke-width="2"/>
  <text class="pf-253a-math" x="150" y="180" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">照片</tspan></text>
  <text class="pf-253a-math" x="150" y="205" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">22 × 29</tspan></text>
  <text class="pf-253a-math" x="75" y="95" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="pf-253a-math" x="225" y="95" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="pf-253a-math" x="75" y="280" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="pf-253a-math" x="225" y="280" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="pf-253a-math" x="150" y="65" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">内宽 22</tspan></text>
  <text class="pf-253a-math" x="38" y="185" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">内长 29</tspan></text>
  <text class="pf-253a-math" x="150" y="315" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">外宽 22 + 2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="pf-253a-math" x="285" y="185" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">外长 29 + 2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  </g>
  <g data-step="2">
  <text class="pf-253a-math" x="50" y="350" text-anchor="start" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">注：四周边框均等宽，故长、宽两侧各加一个 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <text class="pf-253a-math" x="50" y="375" text-anchor="start" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">外边长分别为 (22+2</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">cm</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 与 (29+2</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">cm</tspan></text>
  </g>
  <g data-step="3">
  <text class="pf-253a-lb" x="360" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">面积方程推导（框边面积 = 照片的 1/4）</text>
  <text class="pf-253a-math" x="360" y="75" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1. 照片面积（内面积）：</tspan></text>
  <text class="pf-253a-math" x="385" y="102" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">内面积 = 22 × 29 = 638 (</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">cm</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">²)</tspan></text>
  <text class="pf-253a-math" x="360" y="140" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2. 相框总面积（外面积）：</tspan></text>
  <text class="pf-253a-math" x="385" y="168" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">外面积 = (22 + 2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)(29 + 2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) (</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">cm</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">²)</tspan></text>
  <text class="pf-253a-math" x="360" y="205" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3. 框边面积等量关系：</tspan></text>
  <text class="pf-253a-math" x="385" y="235" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">框边面积 = 外面积 − 内面积 = </tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(1/4) · 内面积</tspan></text>
  <text class="pf-253a-math" x="385" y="268" text-anchor="start" style="font-size:16px;font-weight:600;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(22+2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)(29+2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">) − 638 = 159.5</tspan></text>
  <text class="pf-253a-math" x="360" y="305" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">4. 整理方程并求根：</tspan></text>
  <text class="pf-253a-math" x="385" y="332" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² + 204</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 319 = 0</tspan></text>
  <rect x="380" y="352" width="280" height="50" rx="6" fill="#f0fdf4" stroke="#197a60" stroke-width="1.8"/>
  <text class="pf-253a-math" x="520" y="375" text-anchor="middle" style="font-size:16px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ≈ 1.5 </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">cm</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">  (负根舍去)</tspan></text>
  <text class="pf-253a-math" x="520" y="395" text-anchor="middle" style="font-size:12px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">保留一位小数得到相框宽度 1.5 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">cm</tspan></text>
  </g>
</svg>
