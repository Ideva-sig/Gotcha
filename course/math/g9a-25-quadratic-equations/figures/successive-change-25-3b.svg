<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="sc-253b-t sc-253b-d">
  <title id="sc-253b-t">两次连续变化的模型与解方程筛根</title>
  <desc id="sc-253b-d">上方展示两次连续变化的通用模型：增长行为A→A(1+x)→A(1+x)²；下降行为A→A(1−x)→A(1−x)²。第二次变化的基数是第一年的量，箭头从第一年的整份量出发。下方展示课本成本10000元两年降至6000元实例：方程为10000(1−x)²=6000，结合0≤x&lt;1筛去大于1的无效根，解得年平均下降率约为22.5%。</desc>
  <style>.sc-253b-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.sc-253b-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="440" fill="#fff" stroke="none"/>
  <g data-step="1">
  <text class="sc-253b-lb" x="40" y="32" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">通用模型：连续两次变化</text>
  <text class="sc-253b-math" x="130" y="60" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">【初始量】</tspan></text>
  <text class="sc-253b-math" x="360" y="60" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">【变化一次】</tspan></text>
  <text class="sc-253b-math" x="590" y="60" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">【变化两次】</tspan></text>
  <text class="sc-253b-math" x="40" y="96" text-anchor="start" style="font-size:15px;font-weight:600;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">增长行：</tspan></text>
  <text class="sc-253b-math" x="130" y="96" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">A</tspan></text>
  <path d="M165 92L279.4 92" stroke="#287fc4" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M285 92L278 95.2L278 88.8Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <text class="sc-253b-math" x="225" y="82" text-anchor="middle" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">× (1+</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="sc-253b-math" x="360" y="96" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(1+</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <path d="M425 92L509.4 92" stroke="#287fc4" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M515 92L508 95.2L508 88.8Z" stroke="#287fc4" stroke-width="0.01" fill="#287fc4" stroke-linejoin="round"/>
  <text class="sc-253b-math" x="470" y="82" text-anchor="middle" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">× (1+</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="sc-253b-math" x="590" y="96" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(1+</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)²</tspan></text>
  <text class="sc-253b-math" x="40" y="142" text-anchor="start" style="font-size:15px;font-weight:600;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">下降行：</tspan></text>
  <text class="sc-253b-math" x="130" y="142" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">A</tspan></text>
  <path d="M165 138L279.4 138" stroke="#bf8d08" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M285 138L278 141.2L278 134.8Z" stroke="#bf8d08" stroke-width="0.01" fill="#bf8d08" stroke-linejoin="round"/>
  <text class="sc-253b-math" x="225" y="128" text-anchor="middle" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">× (1−</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="sc-253b-math" x="360" y="142" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(1−</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <path d="M425 138L509.4 138" stroke="#bf8d08" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M515 138L508 141.2L508 134.8Z" stroke="#bf8d08" stroke-width="0.01" fill="#bf8d08" stroke-linejoin="round"/>
  <text class="sc-253b-math" x="470" y="128" text-anchor="middle" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">× (1−</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="sc-253b-math" x="590" y="142" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(1−</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)²</tspan></text>
  <text class="sc-253b-math" x="360" y="178" text-anchor="middle" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">注意：第二次变化是以第一年的整份量为基准，不能写成 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">A</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(1±2</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="2">
  <path d="M35 195L685 195" stroke="#bec9ce" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text class="sc-253b-lb" x="40" y="222" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">课本探究实例：生产成本两年由 10000 元降至 6000 元</text>
  <text class="sc-253b-math" x="110" y="256" text-anchor="middle" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">初始：</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">10000</tspan></text>
  <path d="M170 252L244.4 252" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M250 252L243 255.2L243 248.8Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="sc-253b-math" x="210" y="242" text-anchor="middle" style="font-size:12px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">× (1−</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="sc-253b-math" x="330" y="256" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">一年后：10000(1−</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <path d="M415 252L484.4 252" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M490 252L483 255.2L483 248.8Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="sc-253b-math" x="452" y="242" text-anchor="middle" style="font-size:12px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">× (1−</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="sc-253b-math" x="580" y="256" text-anchor="middle" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">两年后：</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">6000</tspan></text>
  </g>
  <g data-step="3">
  <text class="sc-253b-math" x="60" y="296" text-anchor="start" style="font-size:17px;font-weight:600;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">列方程：</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">10000(1 − </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)² = 6000</tspan></text>
  <text class="sc-253b-math" x="60" y="328" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">整理得：(1 − </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)² = 0.6  ⇒  1 − </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = ±√0.6</tspan></text>
  <text class="sc-253b-math" x="60" y="360" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">候选解：</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 1 − √0.6 ≈ 0.225</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 或 </tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 1 + √0.6 ≈ 1.775</tspan></text>
  <rect x="40" y="380" width="640" height="46" rx="6" fill="#f0fdf4" stroke="#197a60" stroke-width="1.5"/>
  <text class="sc-253b-math" x="55" y="408" text-anchor="start" style="font-size:15px;font-weight:600;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">实际筛根：</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">年下降率必须满足 0 ≤ </tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> &lt; 1</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">；舍去 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> &gt; 1，年平均下降率约为 </tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">22.5%</tspan></text>
  </g>
</svg>
