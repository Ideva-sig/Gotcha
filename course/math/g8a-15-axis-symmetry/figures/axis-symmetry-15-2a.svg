<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="axis-symmetry-15-2a-t axis-symmetry-15-2a-d">
  <title id="axis-symmetry-15-2a-t">平面直角坐标系中的轴对称与将军饮马最短路径</title>
  <desc id="axis-symmetry-15-2a-d">左侧展示点P(-2,6)关于x轴对称到(-2,-6)、关于y轴对称到(2,6)，辅助垂线虚线，等距刻痕同色；右侧展示同侧两点A、B的最短路径，反射点B为B'，连结AB'交直线于C，折线AC+CB转化为直线段AB'最简路径。两点在同侧时使用对称点转化，不暗示路径最短对所有点无条件成立。</desc>
  <style>.axis-symmetry-15-2a-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.axis-symmetry-15-2a-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
