  <text class="axis-symmetry-15-2a-math" x="380" y="366" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2. 连结 </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">AB</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 交直线于点 </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">C</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">，连结 </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">CB</tspan></text>
  <text class="axis-symmetry-15-2a-math" x="380" y="390" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3. 由对称性 </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">CB</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">CB</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">，得 </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">AC</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">CB</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">AB</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">′</tspan></text>
