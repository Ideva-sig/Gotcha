<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fe-185a-t fe-185a-d">
  <title id="fe-185a-t">分式方程去分母漏乘与增根检验</title>
  <desc id="fe-185a-d">第一步展示原分式方程，公分母为(x−1)(x+2)，排除分母为0的限制x≠1和x≠−2。第二步两边同乘公分母，珊瑚红特别标注整式−1必须乘以公分母，不能漏乘。第三步解整式方程得到候选值x=1。第四步将候选值代入最简公分母检验，结果为0产生增根，最终确定原方程无解。</desc>
  <style>.fe-185a-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.fe-185a-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="440" fill="#fff" stroke="none"/>
  <g data-step="1">
  <text class="fe-185a-lb" x="35" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">1. 原分式方程</text>
  <text class="fe-185a-math" x="80" y="68" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <path d="M55 78L105 78" stroke="#20272b" stroke-width="1.5" stroke-linecap="round"/>
  <text class="fe-185a-math" x="80" y="98" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 1</tspan></text>
  <text class="fe-185a-math" x="130" y="78" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">− 1 =</tspan></text>
  <text class="fe-185a-math" x="225" y="68" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan></text>
  <path d="M165 78L285 78" stroke="#20272b" stroke-width="1.5" stroke-linecap="round"/>
  <text class="fe-185a-math" x="225" y="98" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 1)(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 2)</tspan></text>
  <text class="fe-185a-math" x="35" y="136" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">最简公分母：</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−1)(</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+2)</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">；限制：</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ≠ 1 且 </tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ≠ −2</tspan></text>
  </g>
  <g data-step="2">
  <path d="M310 78L338.6 78" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M345 78L337 81.6L337 74.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="fe-185a-lb" x="365" y="35" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">2. 去分母（两边同乘公分母）</text>
  <text class="fe-185a-math" x="365" y="68" text-anchor="start" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+2)</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 1·(</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−1)(</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+2)</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 3</tspan></text>
  <rect x="365" y="95" width="320" height="48" rx="5" fill="#fef2f2" stroke="#c9554d" stroke-width="1.2"/>
  <text class="fe-185a-math" x="378" y="116" text-anchor="start" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">易错警示：整式项 </tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−1</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 必须同样乘公分母！</tspan></text>
  <text class="fe-185a-math" x="378" y="135" text-anchor="start" style="font-size:13px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">若漏乘，就彻底改变了方程，导致错解。</tspan></text>
  </g>
  <g data-step="3">
  <path d="M35 165L685 165" stroke="#bec9ce" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text class="fe-185a-lb" x="35" y="195" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">3. 解整式方程求候选值</text>
  <text class="fe-185a-math" x="35" y="226" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">提取公因式 (</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+2)：</tspan></text>
  <text class="fe-185a-math" x="35" y="256" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">[</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − (</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−1)](</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+2) = 3</tspan></text>
  <text class="fe-185a-math" x="35" y="288" text-anchor="start" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1 · (</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+2) = 3  ⇒  </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 1</tspan></text>
  <rect x="215" y="268" width="65" height="30" rx="4" fill="#e3f1fa" stroke="#287fc4" stroke-width="1.5"/>
  <text class="fe-185a-math" x="247" y="289" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">候选值</tspan></text>
  </g>
  <g data-step="4">
  <path d="M295 280L328.6 280" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M335 280L327 283.6L327 276.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="fe-185a-lb" x="350" y="195" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">4. 代入最简公分母检验</text>
  <text class="fe-185a-math" x="350" y="226" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">代入公分母 (</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−1)(</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+2)：</tspan></text>
  <text class="fe-185a-math" x="350" y="256" text-anchor="start" style="font-size:16px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">当 </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 1 时，(</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 1)(</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 2) = </tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">0 · 3 = 0</tspan></text>
  <path d="M420 276L420 304.4" stroke="#c9554d" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M420 310L416.9 303L423.1 303Z" stroke="#c9554d" stroke-width="0.01" fill="#c9554d" stroke-linejoin="round"/>
  <text class="fe-185a-math" x="435" y="298" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">分母为 0！</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">=1 是增根</tspan></text>
  <rect x="350" y="325" width="335" height="65" rx="8" fill="#fef2f2" stroke="#c9554d" stroke-width="2"/>
  <text class="fe-185a-math" x="517" y="353" text-anchor="middle" style="font-size:15px;font-weight:600;stroke:none"><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = 1 不是原方程的解</tspan></text>
  <text class="fe-185a-math" x="517" y="376" text-anchor="middle" style="font-size:18px;font-weight:700;stroke:none"><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">原分式方程无解</tspan></text>
  </g>
</svg>
