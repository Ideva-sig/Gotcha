<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fc-181b-t fc-181b-d">
  <title id="fc-181b-t">分式的约分与取值限制保留</title>
  <desc id="fc-181b-d">第一步展示原分式，分子为二次三项式9a²+6ab+b²，分母为3a+b。第二步将分子按完全平方公式分解为(3a+b)(3a+b)。第三步用黄色标出分子与分母共有的公因式(3a+b)。第四步约去公因式得到最简结果3a+b；底部始终强调原分母非零条件3a+b≠0必须保留。</desc>
  <style>.fc-181b-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.fc-181b-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="390" fill="#fff" stroke="none"/>
  <rect x="38" y="325" width="644" height="45" rx="6" fill="#f8fafc" stroke="#bec9ce" stroke-width="1"/>
  <text class="fc-181b-math" x="55" y="353" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">原分式有意义的前提条件：</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ≠ 0</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">；约分后结果变为整式，但该限制仍必须保留</tspan></text>
  <g data-step="1">
  <text class="fc-181b-lb" x="40" y="40" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">1. 原分式</text>
  <text class="fc-181b-math" x="110" y="115" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">9</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² + 6</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">ab</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">²</tspan></text>
  <path d="M35 132L185 132" stroke="#20272b" stroke-width="1.8" stroke-linecap="round"/>
  <text class="fc-181b-math" x="110" y="165" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan></text>
  <text class="fc-181b-math" x="110" y="220" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">分子为二次三项式</tspan></text>
  </g>
  <g data-step="2">
  <path d="M192 132L215.6 132" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M222 132L214 135.6L214 128.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="fc-181b-lb" x="236" y="40" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">2. 分子因式分解</text>
  <text class="fc-181b-math" x="310" y="115" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(3</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)(3</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <path d="M235 132L385 132" stroke="#20272b" stroke-width="1.8" stroke-linecap="round"/>
  <text class="fc-181b-math" x="310" y="165" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">b</tspan></text>
  <text class="fc-181b-math" x="310" y="220" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">按完全平方公式分解</tspan></text>
  </g>
  <g data-step="3">
  <path d="M395 132L418.6 132" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M425 132L417 135.6L417 128.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="fc-181b-lb" x="436" y="40" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">3. 标出公因式</text>
  <rect x="480" y="94" width="85" height="30" rx="4" fill="#fef9c3" stroke="#bf8d08" stroke-width="1.5"/>
  <rect x="450" y="144" width="85" height="30" rx="4" fill="#fef9c3" stroke="#bf8d08" stroke-width="1.5"/>
  <text class="fc-181b-math" x="452" y="115" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(3</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="fc-181b-math" x="522" y="115" text-anchor="middle" style="font-size:17px;font-weight:700;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(3</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <path d="M435 132L570 132" stroke="#20272b" stroke-width="1.8" stroke-linecap="round"/>
  <text class="fc-181b-math" x="492" y="165" text-anchor="middle" style="font-size:17px;font-weight:700;stroke:none"><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(3</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="fc-181b-math" x="502" y="220" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">公因式为 </tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(3</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+</tspan><tspan fill="#bf8d08" font-family="Times New Roman,serif" font-style="italic">b</tspan><tspan fill="#bf8d08" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="4">
  <path d="M580 132L598.6 132" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M605 132L597 135.6L597 128.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="fc-181b-lb" x="615" y="40" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">4. 约分结果</text>
  <rect x="612" y="108" width="92" height="50" rx="6" fill="#f0fdf4" stroke="#197a60" stroke-width="2"/>
  <text class="fc-181b-math" x="658" y="140" text-anchor="middle" style="font-size:20px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">3</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">a</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">b</tspan></text>
  <text class="fc-181b-math" x="658" y="220" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">约去共同因式</tspan></text>
  </g>
</svg>
