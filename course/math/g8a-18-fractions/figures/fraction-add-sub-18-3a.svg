<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="fas-183a-t fas-183a-d">
  <title id="fas-183a-t">异分母分式减法与通分括号警惕</title>
  <desc id="fas-183a-d">第一步观察两分母，将x²−64y²分解为(x−8y)(x+8y)，确定最简公分母。第二步通分，后一项分子分母同补乘(x+8y)，补乘项用蓝色。第三步合并分子，强调减号及整个括号−(x+8y)用珊瑚红，展开为2x−x−8y=x−8y。第四步约去公因式x−8y，化简为最简分式1/(x+8y)。底部注明x≠±8y限制全程保留。</desc>
  <style>.fas-183a-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.fas-183a-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="420" fill="#fff" stroke="none"/>
  <rect x="38" y="360" width="644" height="42" rx="6" fill="#f8fafc" stroke="#bec9ce" stroke-width="1"/>
  <text class="fas-183a-math" x="55" y="386" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">限制条件：</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ≠ 8</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> 且 </tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> ≠ −8</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">（分母不能为 0，运算过程全程保留）</tspan></text>
  <g data-step="1">
  <text class="fas-183a-lb" x="35" y="36" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">1. 确定公分母</text>
  <text class="fas-183a-math" x="35" y="68" text-anchor="start" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">原式：</tspan></text>
  <text class="fas-183a-math" x="125" y="90" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <path d="M75 102L175 102" stroke="#20272b" stroke-width="1.5" stroke-linecap="round"/>
  <text class="fas-183a-math" x="125" y="125" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">² − 64</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">²</tspan></text>
  <text class="fas-183a-math" x="190" y="104" text-anchor="middle" style="font-size:20px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−</tspan></text>
  <text class="fas-183a-math" x="235" y="90" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1</tspan></text>
  <path d="M205 102L265 102" stroke="#20272b" stroke-width="1.5" stroke-linecap="round"/>
  <text class="fas-183a-math" x="235" y="125" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan></text>
  <text class="fas-183a-math" x="35" y="168" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">最简公分母：</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−8</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)(</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+8</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="2">
  <path d="M295 102L323.6 102" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M330 102L322 105.6L322 98.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="fas-183a-lb" x="350" y="36" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">2. 通分（补乘因式）</text>
  <text class="fas-183a-math" x="350" y="68" text-anchor="start" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">第二项同乘缺少的因式 </tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+8</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="fas-183a-math" x="425" y="90" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan></text>
  <path d="M365 102L485 102" stroke="#20272b" stroke-width="1.5" stroke-linecap="round"/>
  <text class="fas-183a-math" x="425" y="125" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="fas-183a-math" x="502" y="104" text-anchor="middle" style="font-size:20px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−</tspan></text>
  <text class="fas-183a-math" x="595" y="90" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1 · </tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+8</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <path d="M520 102L670 102" stroke="#20272b" stroke-width="1.5" stroke-linecap="round"/>
  <text class="fas-183a-math" x="595" y="125" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">−8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+8</tspan><tspan fill="#287fc4" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#287fc4" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
  <g data-step="3">
  <text class="fas-183a-lb" x="35" y="215" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">3. 分子相减（必须加括号）</text>
  <text class="fas-183a-math" x="175" y="245" text-anchor="middle" style="font-size:18px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">2</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − (</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 8</tspan><tspan fill="#c9554d" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#c9554d" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <path d="M45 258L305 258" stroke="#20272b" stroke-width="1.8" stroke-linecap="round"/>
  <text class="fas-183a-math" x="175" y="282" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="fas-183a-math" x="175" y="316" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">分子去括号：2</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − </tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 8</tspan><tspan fill="#5d6970" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#5d6970" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> = </tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 8</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">y</tspan></text>
  </g>
  <g data-step="4">
  <path d="M320 258L353.6 258" stroke="#52626a" stroke-width="1.5" stroke-linecap="butt"/>
  <path d="M360 258L352 261.6L352 254.4Z" stroke="#52626a" stroke-width="0.01" fill="#52626a" stroke-linejoin="round"/>
  <text class="fas-183a-lb" x="380" y="215" text-anchor="start" style="fill:#20272b;font-size:15px;font-weight:700">4. 约分得最简分式</text>
  <text class="fas-183a-math" x="475" y="245" text-anchor="middle" style="font-size:17px;font-weight:500;stroke:none"><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 8</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">y</tspan></text>
  <path d="M405 258L545 258" stroke="#20272b" stroke-width="1.8" stroke-linecap="round"/>
  <text class="fas-183a-math" x="475" y="282" text-anchor="middle" style="font-size:15px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)(</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> + 8</tspan><tspan fill="#20272b" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  <text class="fas-183a-math" x="570" y="258" text-anchor="middle" style="font-size:22px;font-weight:500;stroke:none"><tspan fill="#20272b" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">=</tspan></text>
  <rect x="595" y="230" width="85" height="55" rx="6" fill="#f0fdf4" stroke="#197a60" stroke-width="2"/>
  <text class="fas-183a-math" x="637" y="248" text-anchor="middle" style="font-size:17px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">1</tspan></text>
  <path d="M605 256L670 256" stroke="#197a60" stroke-width="1.8" stroke-linecap="round"/>
  <text class="fas-183a-math" x="637" y="276" text-anchor="middle" style="font-size:15px;font-weight:700;stroke:none"><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">+8</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">y</tspan></text>
  <text class="fas-183a-math" x="475" y="316" text-anchor="middle" style="font-size:14px;font-weight:500;stroke:none"><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">约去共同因式 (</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">x</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal"> − 8</tspan><tspan fill="#197a60" font-family="Times New Roman,serif" font-style="italic">y</tspan><tspan fill="#197a60" font-family="-apple-system,PingFang SC,sans-serif" font-style="normal">)</tspan></text>
  </g>
</svg>
