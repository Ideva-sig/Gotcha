    line: 算式允许了，实际情况也得允许！
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-22-2a:
  - who: 福尔摩斯
    line: 横坐标先写，纵坐标别抢位置。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-22-2b:
  - who: 黑猫警长
    line: 图象是关系，不是走过的路线。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-1a:
  - who: 柯南
    line: 先整理式子，再看它是不是一次函数。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-2a:
  - who: 派蒙
    line: 上升还是下降，斜率会告诉你。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-2b:
  - who: 海绵宝宝
    line: 每个点都要代回去，别放走一条线索。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-2c:
  - who: 福尔摩斯
    line: 上下平移，斜率可不跟着变。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-3a:
  - who: 黑猫警长
    line: 交点得同时满足两条方程。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-3b:
  - who: 哆啦A梦
    line: 函数值在上方，不等于横坐标为正。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-4a:
  - who: 柯南
    line: 固定量和变化量，要分开记账。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-23-4b:
  - who: 派蒙
    line: 只给超出的部分换价，别把全部重算！
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-24-1a:
  - who: 柯南
    line: 重复的数据，也得一个个算进去。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-24-1b:
  - who: 派蒙
    line: 分数和权要配对，别给错了位置。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-24-1c:
  - who: 海绵宝宝
    line: 先排好队，再找站在中间的那个。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-24-2a:
  - who: 福尔摩斯
    line: 离差正负会抵消，平方才留得住。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-24-2b:
  - who: 黑猫警长
    line: 波动小不等于分数高，两件事分开看。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-24-3a:
  - who: 哆啦A梦
    line: 中間那个位置先拿开，重复值照常排队。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。
  MATH-8B-24-4a:
  - who: 柯南
    line: 每组有自己的平均数，别借用全班的。
    note: 本项目原创角色口吻，非原作台词；用于外壳提醒，不作题干。

# 八上：项目原创角色提醒，非原作台词。
  MATH-8A-13-1a:
  - who: 柯南
    line: 先认顶点，再认对边；可别按图里的左右猜。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-13-2a:
  - who: 海绵宝宝
    line: 刚好拉成一条直线？那还不是三角形！
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-13-2b:
  - who: 樱木花道
    line: 中线分边，平分线分角，高负责直角。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-13-2c:
  - who: 柯南
    line: 三角形支架稳，但材料也得撑得住。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-13-3a:
  - who: 海绵宝宝
    line: 三个内角一起算，总和不能超过180度。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-13-3b:
  - who: 樱木花道
    line: 这个外角，该找的是不相邻的两个内角。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-14-1a:
  - who: 柯南
    line: 旋转以后也全等！按顶点顺序找对应。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-14-2a:
  - who: 海绵宝宝
    line: 三条边要一一配好，不是随便凑三条。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-14-2b:
  - who: 樱木花道
    line: 两边中间的那个角，才是夹角！
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-14-2c:
  - who: 柯南
    line: 两个角之间的边，才叫夹边。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-14-2d:
  - who: 海绵宝宝
    line: 边不是夹边？先看是不是AAS。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-14-2e:
  - who: 樱木花道
    line: 先找到直角，才能请HL上场。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-14-3a:
  - who: 柯南
    line: 等距要看垂线，斜着连可不算距离。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-1a:
  - who: 海绵宝宝
    line: 对折以后要全部对上，里面的标记也不能漏。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-1b:
  - who: 樱木花道
    line: 两端一样远？去找垂直平分线！
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-1c:
  - who: 柯南
    line: 条件和结论换个位置，还得重新判断。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-2a:
  - who: 海绵宝宝
    line: 关于x轴翻过去，横坐标可不动。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-3a:
  - who: 樱木花道
    line: 腰和底先认清，三线才不会用错地方。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-3b:
  - who: 柯南
    line: 两个角在同一个三角形里相等，再找对边。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-3c:
  - who: 海绵宝宝
    line: 一个60度角不够，还得找等腰条件。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-15-3d:
  - who: 樱木花道
    line: 30度角的对边，是斜边的一半。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-16-1a:
  - who: 柯南
    line: 底数相同，指数才轮到相加。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-16-1b:
  - who: 海绵宝宝
    line: 括号里的系数和负号，也得一起乘方！
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-16-2a:
  - who: 樱木花道
    line: 括号里每一项，都要接住外面的乘法。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-16-2b:
  - who: 柯南
    line: 每一项乘遍每一项，交叉项不能漏。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-16-2c:
  - who: 海绵宝宝
    line: 除式是负数？每一项都要重新查符号。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-16-3a:
  - who: 樱木花道
    line: 相同部分、相反部分都找齐，才用平方差。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-16-3b:
  - who: 柯南
    line: 中间还有二倍乘积项，可不能跳过去！
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-17-1a:
  - who: 海绵宝宝
    line: 最后还剩加法？因式分解还没结束。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-17-1b:
  - who: 樱木花道
    line: 提出这一项以后，括号里还得留下1。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-17-2a:
  - who: 柯南
    line: 两个平方中间是减号，才找平方差。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-17-2b:
  - who: 海绵宝宝
    line: 两端认完，还得核对中间二倍乘积。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-17-2c:
  - who: 樱木花道
    line: 写成乘积不算完，看看每一块还能不能分。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-1a:
  - who: 柯南
    line: 分子为零还不够，分母可不能也为零。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-1b:
  - who: 海绵宝宝
    line: 约分约的是因式，不是加法里的一项。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-1c:
  - who: 樱木花道
    line: 分母补了什么，分子就得补同一份。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-2a:
  - who: 柯南
    line: 取倒数的是除式，不要把两边都翻过去。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-3a:
  - who: 海绵宝宝
    line: 减的是整个分子，先把括号写好！
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-4a:
  - who: 樱木花道
    line: 负指数是倒数，不是负号。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-4b:
  - who: 柯南
    line: 小数点移几位，指数就写负几。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-5a:
  - who: 海绵宝宝
    line: 算出候选值以后，验根这一关还没过。
    note: 项目原创借角色口吻，非原作台词。
  MATH-8A-18-5b:
  - who: 樱木花道
    line: 先统一分钟和小时，再比较谁先到。
    note: 项目原创借角色口吻，非原作台词。
  MATH-7A-01-1a:
    - who: 哆啦A梦
      line: “不是正数”可不一定是负数，口袋里还有个 0 呢。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-01-2a:
    - who: 福尔摩斯
      line: 线索：0 是整数，却既不正也不负。分类时别把它漏了。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-01-2b:
    - who: 柯南
      line: 负号只是“取相反数”，−a 不一定是负数，要看 a 是谁！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-01-2c:
    - who: 樱木花道
      line: 正数比大小我很拿手！但两个负数，绝对值大的反而小。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-02-1a:
    - who: 派蒙
      line: 等等！异号相加，先比谁的绝对值大，符号跟着大的走。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-02-1b:
    - who: 海绵宝宝
      line: 省略括号和加号，不等于扔掉负号哦，它还是那个数的一部分。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-02-2a:
    - who: 灰太狼
      line: 除法变乘法，只把除数倒过来，被除数别乱动！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-02-2b:
    - who: 黑猫警长
      line: 注意，注意！相反数看和为 0，倒数看积为 1，别抓错人。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-02-3a:
    - who: 柯南
      line: (−2)⁴ 和 −2⁴ 长得像，底数却不一样，看括号才知真相。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-02-3b:
    - who: 哆啦A梦
      line: 科学记数法的前一个数要在 1 到 10 之间，超了就调指数。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-02-3c:
    - who: 福尔摩斯
      line: 近似数的精确度，要看最后一位落在哪个数位上。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-03-1a:
    - who: 樱木花道
      line: 数字和字母相乘，数字写前面，省掉乘号，书写也要帅气！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-03-1b:
    - who: 派蒙
      line: “差的平方”和“平方的差”不是一回事，先听清再列式！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-03-1c:
    - who: 海绵宝宝
      line: 乘积一定才是反比例。别看到一个变大一个变小就乱判！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-03-2a:
    - who: 灰太狼
      line: 代入负数，括号别偷懒！不然答案可要被我抓走了。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-04-1a:
    - who: 黑猫警长
      line: 注意，注意！没写指数的字母，指数是 1，算次数别漏了它。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-04-1b:
    - who: 柯南
      line: 多项式的次数，看的是次数最高的那一项。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-04-2a:
    - who: 光头强
      line: 2a 加 3b 可不能合并成 5ab，不是同类项就各过各的！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-04-2b:
    - who: 海绵宝宝
      line: 括号前是负号，括号里每一项都要变号，一个都不能漏。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-04-2c:
    - who: 福尔摩斯
      line: 先化简再代入，是最省力的推理路线。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-05-1a:
    - who: 哆啦A梦
      line: 方程的解，就是能让等式成立的那个数，代进去试一试。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-05-1b:
    - who: 派蒙
      line: 两边同除以一个式子之前，先确认它不是 0！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-05-2a:
    - who: 樱木花道
      line: 移项要变号，跨过等号就变脸，没跨过的保持原样！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-05-2b:
    - who: 灰太狼
      line: 去分母时，没有分母的那一项也要乘，别让它溜走！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-05-3a:
    - who: 柯南
      line: 列方程前，先把单位和数量类型对齐，再找等量关系。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-05-3b:
    - who: 光头强
      line: 配套问题别颠倒：一个桌面配四条腿，腿数是桌面数乘 4。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-1a:
    - who: 海绵宝宝
      line: 先分清哪些图形在一个平面里，哪些是立体的。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-1b:
    - who: 黑猫警长
      line: 注意，注意！从前面、左面、上面看，是三张不同的照片。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-1c:
    - who: 哆啦A梦
      line: 点动成线，线动成面，面动成体，变出来的东西一环扣一环。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-2a:
    - who: 福尔摩斯
      line: 直线两头无限，射线一头有端点，线段两头都有端点，先分清。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-2b:
    - who: 樱木花道
      line: 两点之间，线段最短！这条路我选直线。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-2c:
    - who: 派蒙
      line: 中点把线段分成相等的两段，别把线段的和差想成别的样子。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-3a:
    - who: 柯南
      line: 角的三种表示法，要看顶点是谁；度分秒别忘了是六十进制。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-3b:
    - who: 灰太狼
      line: 角平分线把角分成相等的两份，一人一半，不许偏心！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7A-06-3c:
    - who: 海绵宝宝
      line: 余角合起来是 90°，补角合起来是 180°，别记混了哦。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-1a:
    - who: 黑猫警长
      line: 注意，注意！邻补角要有公共边，另一边还得在同一条直线上。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-1b:
    - who: 福尔摩斯
      line: 点到直线的距离，指的是垂线段的长度，不是随便一条线。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-1c:
    - who: 柯南
      line: 先找截线，再看两个角站在哪一侧，三类角一下就认出来。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-2a:
    - who: 哆啦A梦
      line: 平行线在同一平面内永不相交，这是个很重要的前提。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-2b:
    - who: 樱木花道
      line: 角相等或互补，可以反推两直线平行，这球我接得住！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-2c:
    - who: 派蒙
      line: 等等！平行条件还没给出，就不能直接说同位角相等。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-3a:
    - who: 福尔摩斯
      line: 命题要分清题设和结论，想说它是假的，举一个反例就行。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-07-4a:
    - who: 光头强
      line: 平移可以朝任何方向，大小和形状可不能变。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-08-1a:
    - who: 灰太狼
      line: 正数有两个平方根，别只带走一个！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-08-1b:
    - who: 柯南
      line: 算术平方根只取非负的那个；估算先夹在两个整数之间。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-08-2a:
    - who: 海绵宝宝
      line: 立方根只有一个，负数也有，不用像平方根那样担心。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-08-3a:
    - who: 黑猫警长
      line: 注意，注意！无限不循环小数才是无理数，别只看小数点后有很多位。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-08-3b:
    - who: 樱木花道
      line: 实数和数轴上的点一一对应，比大小就是看谁更靠右。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-08-3c:
    - who: 哆啦A梦
      line: 实数的相反数和绝对值，规则和有理数一样用，别慌。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-09-1a:
    - who: 派蒙
      line: 点的位置先看横坐标，再看纵坐标，顺序别弄反！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-09-1b:
    - who: 光头强
      line: 建立坐标系，原点和轴的方向定好，图形的坐标就明明白白。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-09-2a:
    - who: 福尔摩斯
      line: 用坐标找地点，先选好原点和单位，推理就有了依据。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-09-2b:
    - who: 柯南
      line: 左减右加横坐标，下减上加纵坐标，别把横纵搞混。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-10-1a:
    - who: 海绵宝宝
      line: 方程组的解，是能同时满足两个方程的那一对数。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-10-2a:
    - who: 灰太狼
      line: 代入消元：把一个未知数换成式子，就剩一个未知数啦！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-10-2b:
    - who: 樱木花道
      line: 加减消元要对准系数，减的时候符号可别算错！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-10-3a:
    - who: 黑猫警长
      line: 注意，注意！要找两个独立的等量关系，才能列出方程组。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-10-4a:
    - who: 哆啦A梦
      line: 三个未知数也不怕，先消掉一个，变成二元方程组。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-11-1a:
    - who: 福尔摩斯
      line: 不等式的解有一大堆，叫解集，说清它的范围就行。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-11-1b:
    - who: 派蒙
      line: 乘除负数就要变号！不等号方向要掉头，千万不能忘！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-11-2a:
    - who: 柯南
      line: 去分母时，常数项也要乘公分母，一个都不能漏。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-11-2b:
    - who: 光头强
      line: “至少”是大于等于，“最多”是小于等于，别列反了。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-11-3a:
    - who: 灰太狼
      line: 不等式组的解要取公共部分，不能把两个解拼在一起。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-12-1a:
    - who: 海绵宝宝
      line: 全面调查太累，抽样调查更省力，但样本得有代表性。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-12-1b:
    - who: 樱木花道
      line: 用样本比例估计总体，乘的是总体数量，别乘成样本容量！
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-12-2a:
    - who: 黑猫警长
      line: 注意，注意！圆心角等于百分比乘 360°，别把百分数直接当角度。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-12-2b:
    - who: 福尔摩斯
      line: 直方图的矩形紧挨着，条形图的条是分开的，从这一点就能识别。
      note: 项目原创借角色口吻，非原作台词。
  MATH-7B-12-2c:
    - who: 哆啦A梦
      line: 画趋势图，看的是数量随时间怎么变，走势比单个数更重要。
      note: 项目原创借角色口吻，非原作台词。

