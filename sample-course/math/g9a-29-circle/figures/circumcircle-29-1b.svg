<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="circumcircle-29-1b-t circumcircle-29-1b-d">
  <title id="circumcircle-29-1b-t">作三角形的外接圆</title>
  <desc id="circumcircle-29-1b-d">三步横向排列。第一步画三角形ABC；第二步作AB、BC的垂直平分线；第三步交于O，连接三条蓝色等长半径OA、OB、OC，并作经过三个顶点的圆。垂直平分线是虚线；AB两半用双刻痕、BC两半用三刻痕，三条半径用单刻痕。无动画。</desc>
  <style>.circumcircle-29-1b-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.circumcircle-29-1b-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="720" height="310" fill="#fff" stroke="none"/>
  <g data-step="1">
  <text class="circumcircle-29-1b-lb" x="120" y="30" text-anchor="middle" style="fill:#20272b;font-size:15px;font-weight:600">三角形</text>
  <path d="M87.9 80.1L66.3 202.7L185.8 187Z" stroke="#52626a" stroke-width="2" fill="none" stroke-linejoin="round"/>
