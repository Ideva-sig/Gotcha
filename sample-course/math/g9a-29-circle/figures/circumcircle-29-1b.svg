  <circle cx="66.3" cy="202.7" r="2.5" fill="#20272b"/>
  <text class="circumcircle-29-1b-sy" x="53.5" y="221.5" text-anchor="middle" style="fill:#20272b;font-size:18px">B</text>
  <circle cx="185.8" cy="187" r="2.5" fill="#20272b"/>
  <text class="circumcircle-29-1b-sy" x="201.4" y="202" text-anchor="middle" style="fill:#20272b;font-size:18px">C</text>
  </g>
