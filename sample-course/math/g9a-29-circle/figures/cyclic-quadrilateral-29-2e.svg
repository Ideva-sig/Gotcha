<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="cyclic-quadrilateral-29-2e-t cyclic-quadrilateral-29-2e-d">
  <title id="cyclic-quadrilateral-29-2e-t">圆内接四边形的对角互补</title>
  <desc id="cyclic-quadrilateral-29-2e-d">A、B、C、D按圆周顺序排列，蓝色表示对角A与C，绿色表示对角B与D。两组对角各自的和为180度。角弧按实际边方向计算，不用等角刻痕。四边形不是平行四边形，不显示练习的矩形结论。静态图。</desc>
  <style>.cyclic-quadrilateral-29-2e-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;stroke:none}.cyclic-quadrilateral-29-2e-sy{font:italic 18px "Times New Roman",Times,serif;stroke:none}</style>
  <rect width="640" height="340" fill="#fff" stroke="none"/>
  <circle cx="170" cy="159" r="107" fill="#fff" stroke="#52626a" stroke-width="2"/>
  <path d="M82.4 97.6L124.8 256L262.7 212.5L231.4 71.4Z" stroke="#52626a" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M102 94.2A20 20 0 0 1 87.5 116.9" fill="none" stroke="#287fc4" stroke-width="1.8"/>
  <circle cx="82.4" cy="97.6" r="2.5" fill="#287fc4"/>
  <text class="cyclic-quadrilateral-29-2e-sy" x="67.6" y="93.3" text-anchor="middle" style="fill:#287fc4;font-size:18px">A</text>
  <path d="M119.6 236.7A20 20 0 0 1 143.9 250" fill="none" stroke="#197a60" stroke-width="1.8"/>
  <circle cx="124.8" cy="256" r="2.5" fill="#197a60"/>
  <text class="cyclic-quadrilateral-29-2e-sy" x="117.2" y="278.3" text-anchor="middle" style="fill:#197a60;font-size:18px">B</text>
  <path d="M243.6 218.5A20 20 0 0 1 258.3 193" fill="none" stroke="#287fc4" stroke-width="1.8"/>
  <circle cx="262.7" cy="212.5" r="2.5" fill="#287fc4"/>
  <text class="cyclic-quadrilateral-29-2e-sy" x="278.3" y="227.5" text-anchor="middle" style="fill:#287fc4;font-size:18px">C</text>
  <path d="M235.7 90.9A20 20 0 0 1 211.7 74.8" fill="none" stroke="#197a60" stroke-width="1.8"/>
  <circle cx="231.4" cy="71.4" r="2.5" fill="#197a60"/>
  <text class="cyclic-quadrilateral-29-2e-sy" x="241.7" y="62.6" text-anchor="middle" style="fill:#197a60;font-size:18px">D</text>
  <text class="cyclic-quadrilateral-29-2e-formula" x="468" y="126" text-anchor="middle" style="font-family:Times New Roman, PingFang SC, serif;font-size:22px;font-weight:500;fill:#20272b;stroke:none"><tspan fill="#287fc4">∠<tspan font-style="italic">A</tspan> + ∠<tspan font-style="italic">C</tspan> = 180°</tspan></text>
  <text class="cyclic-quadrilateral-29-2e-formula" x="468" y="199" text-anchor="middle" style="font-family:Times New Roman, PingFang SC, serif;font-size:22px;font-weight:500;fill:#20272b;stroke:none"><tspan fill="#197a60">∠<tspan font-style="italic">B</tspan> + ∠<tspan font-style="italic">D</tspan> = 180°</tspan></text>
</svg>
