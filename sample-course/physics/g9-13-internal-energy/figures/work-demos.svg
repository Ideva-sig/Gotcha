<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="work-demos-t work-demos-d">
  <title id="work-demos-t">做功改变空气的内能：两个课本演示</title>
  <desc id="work-demos-d">左：厚玻璃筒内放一小团棉花，活塞被迅速压下，空气内能增加、温度升高，棉花燃烧。右：烧瓶内装少量水，瓶塞跳起，瓶内气体对瓶塞做功，内能减少，水蒸气液化成白雾。静止画面是活塞已压下、瓶塞已跳起的状态；动画中活塞抬起后猛压下，瓶塞先塞紧再跳起，白雾随之出现。</desc>
  <style>.wd-lb{font:600 14px -apple-system,"PingFang SC",sans-serif;fill:#20272b;stroke:none}</style>
  <path d="M320 20V210" stroke="#d8dfe2" stroke-width="1.6"/>

  <!-- 左：压缩空气 -->
  <rect x="110" y="40" width="50" height="160" rx="3" fill="#eef6fb" stroke="#52626a" stroke-width="2.4"/>
  <g>
    <rect x="113" y="120" width="44" height="12" rx="2" fill="#bec9ce" stroke="#52626a" stroke-width="1.8"/>
    <path d="M135 120V26M117 26H153" stroke="#52626a" stroke-width="2.4"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -50;0 -50;0 0;0 0" keyTimes="0;0.15;0.5;0.58;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <g fill="#287fc4">
    <circle cx="124" cy="150" r="3"/><circle cx="146" cy="158" r="3"/><circle cx="132" cy="172" r="3"/><circle cx="150" cy="180" r="3"/><circle cx="120" cy="184" r="3"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;-1 1;0 0" dur="0.4s" repeatCount="indefinite"/>
  </g>
  <path d="M122 197c-3-7 5-10 9-7 2-6 10-6 11 0 5-3 11 2 7 7z" fill="#fff" stroke="#7d8990" stroke-width="1.4"/>
  <path d="M135 188c-6-7-1-14 3-18 0 6 6 7 4 14 3-3 3-6 3-9 4 6 1 12-3 13z" fill="#f2a33a" stroke="#c9554d" stroke-width="1.3">
    <animate attributeName="opacity" values="1;0.15;0.15;1;1" keyTimes="0;0.15;0.5;0.62;1" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M190 52V96" stroke="#c9554d" stroke-width="2.6"/>
  <path d="M190 106l-6-12h12z" fill="#c9554d" stroke="none"/>
  <text class="wd-lb" x="135" y="228" text-anchor="middle">压缩空气</text>

  <!-- 右：瓶塞跳起 -->
  <path d="M460 60V95.9A55 55 0 1 0 480 95.9V60Z" fill="#f4f8fa" stroke="none"/>
  <path d="M427.6 185A55 55 0 0 0 512.4 185Z" fill="#dceff9" stroke="none"/>
  <path d="M460 60V95.9A55 55 0 1 0 480 95.9V60" stroke="#52626a" stroke-width="2.4"/>
  <g fill="#b8c4ca">
    <circle cx="450" cy="120" r="2.6"/><circle cx="470" cy="112" r="2.6"/><circle cx="490" cy="124" r="2.6"/>
    <circle cx="440" cy="142" r="2.6"/><circle cx="462" cy="136" r="2.6"/><circle cx="484" cy="146" r="2.6"/>
    <circle cx="504" cy="138" r="2.6"/><circle cx="452" cy="162" r="2.6"/><circle cx="476" cy="164" r="2.6"/>
    <circle cx="498" cy="160" r="2.6"/><circle cx="470" cy="100" r="2.6"/>
    <animate attributeName="opacity" values="1;0.12;0.12;1;1" keyTimes="0;0.05;0.58;0.68;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <g>
    <path d="M458 50H482L479 30H461Z" fill="#c9a77c" stroke="#52626a" stroke-width="1.8"/>
    <path d="M470 30C470 16 452 12 434 16" stroke="#52626a" stroke-width="1.8"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 26;0 26;0 0;0 0" keyTimes="0;0.05;0.55;0.62;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <path d="M520 96V54" stroke="#197a60" stroke-width="2.6"/>
  <path d="M520 44l-6 12h12z" fill="#197a60" stroke="none"/>
  <text class="wd-lb" x="470" y="228" text-anchor="middle">瓶塞跳起</text>
</svg>
