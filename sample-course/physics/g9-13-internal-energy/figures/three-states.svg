<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="ts-t ts-d">
  <title id="ts-t">固态、液态、气态的分子排列</title>
  <desc id="ts-d">固态分子紧密、整齐排列；液态分子之间距离比固体略大，排列没有固定位置，聚在容器底部；气态分子相距很远，分散在整个容器中。</desc>
  <style>.ts-box{fill:#f8fafb;stroke:#bec9ce;stroke-width:2}.ts-t{font:600 19px -apple-system,"PingFang SC",sans-serif;fill:#20272b}.ts-s{font:500 14px -apple-system,"PingFang SC",sans-serif;fill:#5d6970}.ts-m{fill:#287fc4}.ts-a{fill:none;stroke:#7d8990;stroke-width:1.6;stroke-linecap:round}</style>
  <rect width="900" height="330" fill="#ffffff"/>
  <text class="ts-t" x="160" y="34" text-anchor="middle">固态</text>
  <rect class="ts-box" x="30" y="50" width="260" height="200" rx="6"/>
  <text class="ts-s" x="160" y="280" text-anchor="middle">分子间距离小，作用力大</text>
  <text class="ts-s" x="160" y="304" text-anchor="middle">有一定的形状和体积</text>
  <text class="ts-t" x="450" y="34" text-anchor="middle">液态</text>
  <rect class="ts-box" x="320" y="50" width="260" height="200" rx="6"/>
  <text class="ts-s" x="450" y="280" text-anchor="middle">距离比固体略大，作用力较小</text>
  <text class="ts-s" x="450" y="304" text-anchor="middle">有一定的体积，没有确定的形状</text>
  <text class="ts-t" x="740" y="34" text-anchor="middle">气态</text>
  <rect class="ts-box" x="610" y="50" width="260" height="200" rx="6"/>
  <text class="ts-s" x="740" y="280" text-anchor="middle">距离很大，几乎没有作用力</text>
  <text class="ts-s" x="740" y="304" text-anchor="middle">没有确定的形状和体积</text>
