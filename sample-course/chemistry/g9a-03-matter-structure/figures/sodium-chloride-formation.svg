<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="scf-t scf-d">
  <title id="scf-t">钠与氯气反应生成氯化钠微观示意图</title>
  <desc id="scf-d">展示钠原子失去1个最外层电子形成钠离子、氯原子得到1个电子形成氯离子，阴阳离子通过静电作用形成氯化钠的微观过程。</desc>
  <style>
    .scf-bg { fill: #ffffff; }
    .scf-card { fill: #f8fafb; stroke: #bec9ce; stroke-width: 1.6; rx: 6px; }
    .scf-box { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.2; rx: 4px; }
    .scf-nucl-na { fill: #fdf5f4; stroke: #c9554d; stroke-width: 1.6; }
    .scf-nucl-cl { fill: #e8f5e9; stroke: #197a60; stroke-width: 1.6; }
    .scf-arc { fill: none; stroke: #287fc4; stroke-width: 1.6; }
    .scf-transfer { fill: none; stroke: #bf8d08; stroke-width: 2.2; stroke-dasharray: 4 2; }
    .scf-transfer-head { fill: #bf8d08; }
    .scf-e { fill: #ffb300; stroke: #f57f17; stroke-width: 1; }
    .scf-title { font: 600 15px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .scf-label { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #20272b; }
    .scf-sub { font: 400 12px -apple-system, "PingFang SC", sans-serif; fill: #52626a; }
    .scf-eq { font: 600 12px -apple-system, "PingFang SC", sans-serif; fill: #287fc4; }
    .scf-red { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #c9554d; }
    .scf-green { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #197a60; }
    .scf-blue { font: 600 13px -apple-system, "PingFang SC", sans-serif; fill: #287fc4; }
    .scf-sec-b { fill: #f0f7fb; stroke: #287fc4; stroke-width: 1.2; rx: 4px; }
    .scf-sec-g { fill: #f4fbf7; stroke: #197a60; stroke-width: 1.2; rx: 4px; }
  </style>
  <rect class="scf-bg" width="780" height="400"/>

  <!-- Top Title Banner -->
  <rect class="scf-card" x="25" y="14" width="730" height="36"/>
  <text class="scf-title" x="390" y="37" text-anchor="middle">微观示意图：钠与氯气反应生成氯化钠（离子的形成过程）</text>

  <!-- Main Diagram Container -->
  <rect class="scf-card" x="25" y="60" width="730" height="200"/>
  <rect x="35" y="68" width="710" height="24" rx="3" fill="#e1f5fe"/>
  <text class="scf-label" x="390" y="84" text-anchor="middle" fill="#287fc4">电子转移与离子形成微观示意（课本图 3-12）</text>

  <!-- Left Box: 反应前原子 (x=45, w=300, y=98..250) -->
  <rect class="scf-box" x="45" y="98" width="300" height="152"/>
  <text class="scf-label" x="195" y="116" text-anchor="middle">【反应前：原子状态】</text>

  <!-- Na Atom: cx=105, cy=160 -->
  <circle cx="105" cy="155" r="16" class="scf-nucl-na"/>
  <text x="105" y="160" font-size="12" font-weight="600" fill="#c9554d" text-anchor="middle">+11</text>
  <!-- Shells Na: 2, 8, 1 -->
  <path class="scf-arc" d="M 125 140 A 24 24 0 0 1 125 170"/>
  <rect x="126" y="148" width="12" height="14" fill="#ffffff"/><text x="132" y="159" font-size="10" fill="#287fc4" text-anchor="middle">2</text>
  <path class="scf-arc" d="M 140 135 A 40 40 0 0 1 140 175"/>
  <rect x="141" y="148" width="12" height="14" fill="#ffffff"/><text x="147" y="159" font-size="10" fill="#287fc4" text-anchor="middle">8</text>
  <path class="scf-arc" d="M 155 130 A 56 56 0 0 1 155 180"/>
  <rect x="156" y="148" width="12" height="14" fill="#ffffff"/><text x="162" y="159" font-size="10" font-weight="600" fill="#bf8d08" text-anchor="middle">1</text>
  <circle cx="157" cy="142" r="3.5" class="scf-e"/>
  <text class="scf-red" x="120" y="208" text-anchor="middle">钠原子（Na）</text>
  <text class="scf-sub" x="120" y="226" text-anchor="middle">最外层 1 个电子，易失去</text>

  <!-- Cl Atom: cx=240, cy=155 -->
  <circle cx="235" cy="155" r="16" class="scf-nucl-cl"/>
  <text x="235" y="160" font-size="12" font-weight="600" fill="#197a60" text-anchor="middle">+17</text>
  <!-- Shells Cl: 2, 8, 7 -->
  <path class="scf-arc" d="M 255 140 A 24 24 0 0 1 255 170"/>
  <rect x="256" y="148" width="12" height="14" fill="#ffffff"/><text x="262" y="159" font-size="10" fill="#287fc4" text-anchor="middle">2</text>
  <path class="scf-arc" d="M 270 135 A 40 40 0 0 1 270 175"/>
  <rect x="271" y="148" width="12" height="14" fill="#ffffff"/><text x="277" y="159" font-size="10" fill="#287fc4" text-anchor="middle">8</text>
  <path class="scf-arc" d="M 285 130 A 56 56 0 0 1 285 180"/>
  <rect x="286" y="148" width="12" height="14" fill="#ffffff"/><text x="292" y="159" font-size="10" font-weight="600" fill="#bf8d08" text-anchor="middle">7</text>
  <circle cx="287" cy="142" r="3.5" class="scf-e"/>
  <text class="scf-green" x="260" y="208" text-anchor="middle">氯原子（Cl）</text>
  <text class="scf-sub" x="260" y="226" text-anchor="middle">最外层 7 个电子，易得到</text>

  <!-- Middle: Electron Transfer Arrow (x=345..425) -->
  <path class="scf-transfer" d="M 160 142 Q 225 105 285 140"/>
  <polygon points="285,134 293,142 284,146" class="scf-transfer-head"/>
  <rect x="355" y="155" width="66" height="22" rx="3" fill="#fff9c4" stroke="#bf8d08" stroke-width="1"/>
  <text x="388" y="170" font-size="11" font-weight="600" fill="#bf8d08" text-anchor="middle">转移 1 个 e⁻</text>

  <!-- Right Box: 反应后离子与结合 (x=435, w=300, y=98..250) -->
  <rect class="scf-box" x="435" y="98" width="300" height="152"/>
  <text class="scf-label" x="585" y="116" text-anchor="middle">【反应后：离子状态与结合】</text>

  <!-- Na+ Ion: cx=485, cy=155 -->
  <circle cx="485" cy="155" r="16" class="scf-nucl-na"/>
  <text x="485" y="160" font-size="12" font-weight="600" fill="#c9554d" text-anchor="middle">+11</text>
  <!-- Shells Na+: 2, 8 (stable) -->
  <path class="scf-arc" d="M 505 140 A 24 24 0 0 1 505 170"/>
  <rect x="506" y="148" width="12" height="14" fill="#ffffff"/><text x="512" y="159" font-size="10" fill="#287fc4" text-anchor="middle">2</text>
  <path class="scf-arc" d="M 520 135 A 40 40 0 0 1 520 175"/>
  <rect x="521" y="148" width="12" height="14" fill="#ffffff"/><text x="527" y="159" font-size="10" font-weight="600" fill="#197a60" text-anchor="middle">8</text>
  <text class="scf-red" x="485" y="206" text-anchor="middle">钠离子（Na⁺）</text>
  <text class="scf-sub" x="485" y="224" text-anchor="middle">失 1 个电子</text>

  <!-- Cl- Ion: cx=620, cy=155 -->
  <circle cx="620" cy="155" r="16" class="scf-nucl-cl"/>
  <text x="620" y="160" font-size="12" font-weight="600" fill="#197a60" text-anchor="middle">+17</text>
  <!-- Shells Cl-: 2, 8, 8 (stable) -->
  <path class="scf-arc" d="M 640 140 A 24 24 0 0 1 640 170"/>
  <rect x="641" y="148" width="12" height="14" fill="#ffffff"/><text x="647" y="159" font-size="10" fill="#287fc4" text-anchor="middle">2</text>
  <path class="scf-arc" d="M 655 135 A 40 40 0 0 1 655 175"/>
  <rect x="656" y="148" width="12" height="14" fill="#ffffff"/><text x="662" y="159" font-size="10" fill="#287fc4" text-anchor="middle">8</text>
  <path class="scf-arc" d="M 670 130 A 56 56 0 0 1 670 180"/>
  <rect x="671" y="148" width="12" height="14" fill="#ffffff"/><text x="677" y="159" font-size="10" font-weight="600" fill="#197a60" text-anchor="middle">8</text>
  <text class="scf-green" x="620" y="206" text-anchor="middle">氯离子（Cl⁻）</text>
  <text class="scf-sub" x="620" y="224" text-anchor="middle">得 1 个电子</text>

  <!-- Electrostatic attraction link between Na+ and Cl- -->
  <path d="M 530 155 L 575 155" fill="none" stroke="#287fc4" stroke-width="1.4" stroke-dasharray="2 2"/>
  <text x="552" y="145" font-size="10" font-weight="600" fill="#287fc4" text-anchor="middle">静电作用</text>
  <text x="552" y="240" font-size="11" font-weight="600" fill="#20272b" text-anchor="middle">形成氯化钠</text>

  <!-- Bottom Left Card: 离子概念与形成规律 -->
  <rect class="scf-sec-b" x="25" y="268" width="355" height="120"/>
  <text class="scf-label" x="35" y="288" fill="#287fc4">离子的形成规律：</text>
  <text class="scf-sub" x="35" y="310">• 阳离子：金属原子最外层电子少于4，易失去电子带正电</text>
  <text class="scf-sub" x="35" y="332">• 阴离子：非金属原子最外层电子多于4，易得到电子带负电</text>
  <text class="scf-sub" x="35" y="354">• 质子数不变：形成离子改变的是最外层电子数，核内不变</text>
  <text class="scf-sub" x="35" y="374">• 稳定结构：最外层达到 8 电子（第一层为最外层时为 2 个）</text>

  <!-- Bottom Right Card: 离子符号与电荷含义 -->
  <rect class="scf-sec-g" x="400" y="268" width="355" height="120"/>
  <text class="scf-label" x="410" y="290" fill="#197a60">离子符号书写与形成反应：</text>
  <text class="scf-sub" x="410" y="316">• 符号规则：右上角标电荷数与符号，数值为 1 省略（Na⁺、Cl⁻）</text>
  <text class="scf-sub" x="410" y="342">• 相互作用：带相反电荷离子靠静电作用结合，整体不显电性</text>
  <text class="scf-sub" x="410" y="368">• 文字表达式：钠 ＋ 氯气 → 氯化钠（点燃）</text>
</svg>
