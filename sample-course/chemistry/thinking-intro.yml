# “思维提升”页开头的说明文字（网站原样显示）。格式见 course/FORMAT.md“思维提升说明文件”。
lead: 同一件事，化学有三种说法。遇到化学题，换着说一遍：
steps:
  - head: 看得见的（宏观）
    text: 实验里能看到、闻到、测到什么：冒气泡、变红、变浑浊。
  - head: 看不见的（微观）
    text: 粒子在做什么：分子分开、原子重新组合、离子结合。
  - head: 写出来的（符号）
    text: 把它写成化学式或化学方程式，系数和条件都要对。
note: 这是化学里一种很有用的看问题办法：宏观（看得见的）、微观（看不见的）、符号（写出来的），三种说法互相对照，哪一边对不上，就说明哪里想错了。课程标准把它列为化学科学思维的认识方式，原文是“从宏观、微观、符号相结合的视角探究物质及其变化规律”。
source: 出处：《义务教育化学课程标准（2022年版）》第 13 页（印刷页 6）
