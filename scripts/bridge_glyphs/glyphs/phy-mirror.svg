<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 90">
  <title>平面镜成像距离</title>
  <desc>竖直平面镜两侧的物体与虚像大小相同，到镜面的距离 u 和 v 都是 32。</desc>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M75 8 V80" stroke="#52626a" stroke-width="4"/>
    <path d="M43 40 H107 M43 60 H107" stroke="#9aa5a8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M43 60 V46" stroke="currentColor" stroke-width="4"/>
    <path d="M107 60 V47" stroke="#c9554d" stroke-width="4" stroke-dasharray="4 3"/>
    <path d="M43 71 H75 M75 71 H107 M43 67 V75 M75 67 V75 M107 67 V75" stroke="#9aa5a8" stroke-width="2"/>
  </g>
  <path d="M43 40 L38.5 47.5 H47.5 Z" fill="currentColor"/>
  <path d="M107 40 L102.5 47.5 H111.5 Z" fill="#c9554d"/>
  <g fill="#2b3a3f" font-family="sans-serif" font-size="13">
    <text x="55" y="88">u</text>
    <text x="92" y="88">v</text>
  </g>
</svg>
