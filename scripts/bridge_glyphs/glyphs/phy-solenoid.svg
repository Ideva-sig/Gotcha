    <path d="M34 20 L50 52 M50 20 L66 52 M66 20 L82 52 M82 20 L98 52 M98 20 L114 52" stroke="#52626a" stroke-width="3.5"/>
    <path d="M38.5 29 L44.9 41.8 M54.5 29 L60.9 41.8 M70.5 29 L76.9 41.8 M86.5 29 L92.9 41.8 M102.5 29 L108.9 41.8" stroke="currentColor" stroke-width="2.8"/>
    <path d="M70 65 V83 M80 69 V79" stroke="#52626a" stroke-width="2.5"/>
  </g>
  <g fill="currentColor">
    <path d="M44.9 41.8 L40 38.7 L45.3 36 Z"/>
    <path d="M60.9 41.8 L56 38.7 L61.3 36 Z"/>
    <path d="M76.9 41.8 L72 38.7 L77.3 36 Z"/>
    <path d="M92.9 41.8 L88 38.7 L93.3 36 Z"/>
    <path d="M108.9 41.8 L104 38.7 L109.3 36 Z"/>
