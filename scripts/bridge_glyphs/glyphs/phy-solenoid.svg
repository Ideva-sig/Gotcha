  <title>通电螺线管的磁极</title>
  <desc>五匝螺线管接入电池，正面电流沿各匝斜向右下方流动，因此右端为 N 极，左端为 S 极。</desc>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
