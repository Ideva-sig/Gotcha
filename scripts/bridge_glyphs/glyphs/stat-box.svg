<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 90" stroke-linecap="round" stroke-linejoin="round">
  <title>箱线图的五个位置</title>
  <desc>水平箱线图，最小值、第一四分位数、中位数、第三四分位数、最大值依次位于 17、43、73、107、134。静态图。</desc>
  <path d="M 17 45 L 43 45" fill="none" stroke="#52626a" stroke-width="2"/>
  <path d="M 107 45 L 134 45" fill="none" stroke="#52626a" stroke-width="2"/>
  <polygon points="43,30 107,30 107,60 43,60" stroke="currentColor" stroke-width="4" fill="currentColor" fill-opacity="0.18"/>
  <path d="M 73 30 L 73 60" fill="none" stroke="currentColor" stroke-width="4"/>
  <path d="M 17 36 L 17 54" fill="none" stroke="#52626a" stroke-width="2"/>
  <path d="M 134 36 L 134 54" fill="none" stroke="#52626a" stroke-width="2"/>
